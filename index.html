<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Vendas IA + Pix</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 20px;

  font-family: Arial, Helvetica, sans-serif;

  background: #f4f6f8;

  color: #222;
}

.container {

  width: 100%;
  max-width: 650px;

  margin: auto;
}

.card {

  background: white;

  border-radius: 18px;

  padding: 22px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.08);
}

h1 {

  text-align: center;

  margin-top: 0;

  font-size: 25px;
}

.subtitulo {

  text-align: center;

  color: #666;

  margin-bottom: 25px;
}

label {

  display: block;

  font-weight: bold;

  margin-top: 15px;

  margin-bottom: 6px;
}

input,
textarea {

  width: 100%;

  padding: 13px;

  border: 1px solid #ddd;

  border-radius: 10px;

  font-size: 16px;

  outline: none;
}

textarea {

  min-height: 80px;

  resize: vertical;
}

.linha {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;
}

.voz-area {

  text-align: center;

  padding: 10px 0 20px;
}

#voiceBtn {

  width: 90px;

  height: 90px;

  border-radius: 50%;

  border: none;

  background: #111;

  color: white;

  font-size: 36px;

  cursor: pointer;
}

#voiceBtn.recording {

  background: #d62828;

  animation: pulsar 1.2s infinite;
}

@keyframes pulsar {

  0% {
    box-shadow: 0 0 0 0 rgba(214,40,40,.6);
  }

  70% {
    box-shadow: 0 0 0 22px rgba(214,40,40,0);
  }

  100% {
    box-shadow: 0 0 0 0 rgba(214,40,40,0);
  }
}

#voiceStatus {

  margin-top: 12px;

  font-weight: bold;

  min-height: 24px;
}

.transcricao {

  background: #f0f2f4;

  border-radius: 12px;

  padding: 14px;

  margin-top: 12px;

  min-height: 50px;

  text-align: left;
}

.ajuda {

  margin-top: 10px;

  font-size: 14px;

  color: #777;

  line-height: 1.5;
}

button {

  border: none;

  border-radius: 10px;

  padding: 14px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

.btnSalvar {

  width: 100%;

  margin-top: 20px;

  background: #16803c;

  color: white;

  font-size: 18px;
}

.btnSalvar:disabled {

  background: #aaa;

  cursor: not-allowed;
}

.btnLimpar {

  width: 100%;

  margin-top: 10px;

  background: #eee;
}

.resultado {

  display: none;

  margin-top: 22px;

  padding: 18px;

  border-radius: 14px;

  background: #eef8f1;

  border: 1px solid #b7dfc2;
}

.pix {

  background: white;

  border: 1px solid #ddd;

  border-radius: 10px;

  padding: 12px;

  margin-top: 12px;

  word-break: break-all;

  font-size: 13px;
}

.btnCopiar {

  width: 100%;

  margin-top: 10px;

  background: #222;

  color: white;
}

.erro,
.sucesso {

  padding: 14px;

  border-radius: 10px;

  margin-top: 15px;
}

.erro {

  background: #fff0f0;

  border: 1px solid #e5aaaa;

  color: #9d1c1c;

  display: none;
}

.sucesso {

  background: #edf9f0;

  border: 1px solid #b8dfc1;

  color: #16652d;

  display: none;
}

.produto {

  background: #f6f6f6;

  padding: 10px;

  border-radius: 9px;

  margin-top: 8px;
}

.qr {

  text-align: center;

  margin-top: 15px;
}

.qr img {

  width: 220px;

  height: 220px;

  max-width: 100%;
}

@media(max-width:550px) {

  body {
    padding: 10px;
  }

  .card {
    padding: 16px;
  }

  .linha {
    grid-template-columns: 1fr;
  }
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>💰 Vendas IA + Pix</h1>

<div class="subtitulo">
Registre sua venda falando
</div>


<!-- VOZ -->

<div class="voz-area">

<button
  id="voiceBtn"
  onclick="iniciarVoz()"
>
🎤
</button>

<div id="voiceStatus">
Clique no microfone e fale a venda
</div>

<div
  id="transcript"
  class="transcricao"
>
A fala reconhecida aparecerá aqui.
</div>

<div class="ajuda">

Exemplo:

<br>

<b>
"Venda para João, dois pastéis e uma Coca-Cola, total de trinta reais."
</b>

</div>

</div>


<div
  id="erro"
  class="erro"
></div>


<div
  id="sucesso"
  class="sucesso"
></div>


<label>Cliente</label>

<input
  id="cliente"
  type="text"
  placeholder="Nome do cliente"
>


<label>Descrição da venda</label>

<textarea
  id="descricao"
  placeholder="Descrição da venda"
></textarea>


<div class="linha">

<div>

<label>Valor total</label>

<input
  id="valor"
  type="text"
  inputmode="decimal"
  placeholder="0,00"
>

</div>

<div>

<label>ID da venda</label>

<input
  id="idVenda"
  type="text"
  readonly
>

</div>

</div>


<div
  id="produtos"
  class="produtos"
></div>


<button
  id="btnSalvar"
  class="btnSalvar"
  onclick="salvarVenda()"
>
💳 SALVAR E GERAR PIX
</button>


<button
  class="btnLimpar"
  onclick="limparTela()"
>
🧹 LIMPAR
</button>


<div
  id="resultado"
  class="resultado"
>

<h2>✅ Venda salva!</h2>

<div id="mensagemResultado"></div>

<div class="qr">

<img
  id="qrCode"
  alt="QR Code Pix"
>

</div>

<div
  id="pixCode"
  class="pix"
></div>

<button
  class="btnCopiar"
  onclick="copiarPix()"
>
📋 COPIAR PIX
</button>

</div>

</div>

</div>


<script>

/*******************************************************
 * URL DO SEU WEB APP
 *******************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbxle6M6YL49_kNO4XJZK_VRP243jQ6F-d3p88_hulomPP5kMgyd4jO9qxIYQY03rdChqg/exec';


/*******************************************************
 * VOZ
 *******************************************************/

let reconhecimento = null;

let gravando = false;

let textoReconhecido = '';


const voiceBtn =
  document.getElementById(
    'voiceBtn'
  );

const voiceStatus =
  document.getElementById(
    'voiceStatus'
  );

const transcript =
  document.getElementById(
    'transcript'
  );


function iniciarVoz() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    mostrarErro(
      'Seu navegador não suporta reconhecimento de voz. Use o Google Chrome.'
    );

    return;

  }


  if (gravando) {

    if (reconhecimento) {

      reconhecimento.stop();

    }

    return;

  }


  textoReconhecido = '';


  reconhecimento =
    new SpeechRecognition();


  reconhecimento.lang =
    'pt-BR';


  reconhecimento.continuous =
    false;


  reconhecimento.interimResults =
    true;


  reconhecimento.maxAlternatives =
    1;


  reconhecimento.onstart =
    function() {

      gravando = true;

      voiceBtn.classList.add(
        'recording'
      );

      voiceBtn.textContent =
        '⏹️';

      voiceStatus.textContent =
        '🔴 Ouvindo... fale a venda';

      transcript.textContent =
        'Estou ouvindo...';

      esconderErro();

    };


  reconhecimento.onresult =
    function(event) {

      let texto =
        '';


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        texto +=
          event.results[i][0]
            .transcript;

      }


      texto =
        texto.trim();


      if (texto) {

        transcript.textContent =
          texto;

        textoReconhecido =
          texto;

      }

    };


  reconhecimento.onerror =
    function(event) {

      console.error(
        'Erro de voz:',
        event.error
      );


      finalizarVoz();


      if (
        event.error ===
        'not-allowed'
      ) {

        mostrarErro(
          '🚫 Permita o acesso ao microfone no navegador.'
        );

        return;

      }


      if (
        event.error ===
        'no-speech'
      ) {

        mostrarErro(
          '🎤 Não detectei sua fala. Clique novamente e fale a venda.'
        );

        return;

      }


      if (
        event.error ===
        'audio-capture'
      ) {

        mostrarErro(
          '🎤 Não consegui acessar o microfone.'
        );

        return;

      }


      mostrarErro(
        'Erro no reconhecimento de voz: ' +
        event.error
      );

    };


  reconhecimento.onend =
    function() {

      finalizarVoz();


      /*
       * Só envia para IA depois
       * que o reconhecimento terminou.
       */

      if (
        textoReconhecido
      ) {

        interpretarIA(
          textoReconhecido
        );

      }

    };


  try {

    reconhecimento.start();

  } catch (erro) {

    console.error(
      erro
    );

    finalizarVoz();

    mostrarErro(
      'Não foi possível iniciar o microfone.'
    );

  }

}


function finalizarVoz() {

  gravando =
    false;

  voiceBtn.classList.remove(
    'recording'
  );

  voiceBtn.textContent =
    '🎤';

}


/*******************************************************
 * INTERPRETAR IA
 *******************************************************/

function interpretarIA(
  texto
) {

  if (!texto) {

    mostrarErro(
      'Não recebi o texto da sua fala.'
    );

    return;

  }


  voiceStatus.textContent =
    '🤖 Analisando a venda...';


  api(
    'interpretarVenda',
    {
      texto: texto
    },

    function(resultado) {

      console.log(
        'IA:',
        resultado
      );


      if (
        !resultado
      ) {

        mostrarErro(
          'O servidor não retornou resposta.'
        );

        return;

      }


      if (
        resultado.success === false &&
        resultado.erro
      ) {

        mostrarErro(
          resultado.erro
        );

        return;

      }


      if (
        resultado.erro
      ) {

        if (
          resultado.erro ===
          'valor_ausente'
        ) {

          mostrarErro(
            'Não encontrei o valor total. Fale o valor da venda.'
          );

        } else {

          mostrarErro(
            'Não consegui identificar a venda.'
          );

        }

        return;

      }


      /*
       * PREENCHER CAMPOS
       */

      document
        .getElementById(
          'cliente'
        )
        .value =
        resultado.cliente ||
        '';


      document
        .getElementById(
          'descricao'
        )
        .value =
        resultado.descricao ||
        '';


      if (
        resultado.valor !==
        undefined
      ) {

        document
          .getElementById(
            'valor'
          )
          .value =
          String(
            resultado.valor
          )
          .replace(
            '.',
            ','
          );

      }


      mostrarProdutos(
        resultado.produtos ||
        []
      );


      voiceStatus.textContent =
        '✅ Venda identificada! Confira os dados.';


      mostrarSucesso(
        'A venda foi identificada. Agora clique em SALVAR E GERAR PIX.'
      );

    }

  );

}


/*******************************************************
 * PRODUTOS
 *******************************************************/

function mostrarProdutos(
  produtos
) {

  const div =
    document.getElementById(
      'produtos'
    );


  div.innerHTML =
    '';


  if (
    !Array.isArray(produtos) ||
    produtos.length === 0
  ) {

    return;

  }


  const titulo =
    document.createElement(
      'div'
    );


  titulo.innerHTML =
    '<b>🛒 Produtos identificados:</b>';


  div.appendChild(
    titulo
  );


  produtos.forEach(
    function(produto) {

      const item =
        document.createElement(
          'div'
        );


      item.className =
        'produto';


      const nome =
        produto.nome ||
        'Produto';


      const quantidade =
        produto.quantidade ||
        1;


      let texto =
        '🛒 ' +
        quantidade +
        'x ' +
        nome;


      if (
        produto.valorTotal !==
        undefined
      ) {

        texto +=
          ' — R$ ' +
          Number(
            produto.valorTotal
          )
          .toFixed(2)
          .replace(
            '.',
            ','
          );

      }


      item.textContent =
        texto;


      div.appendChild(
        item
      );

    }
  );

}


/*******************************************************
 * SALVAR
 *******************************************************/

function salvarVenda() {

  esconderErro();


  const cliente =
    document
      .getElementById(
        'cliente'
      )
      .value
      .trim();


  const descricao =
    document
      .getElementById(
        'descricao'
      )
      .value
      .trim();


  const valorTexto =
    document
      .getElementById(
        'valor'
      )
      .value
      .trim();


  if (!descricao) {

    mostrarErro(
      'Digite ou dite a descrição da venda.'
    );

    return;

  }


  if (!valorTexto) {

    mostrarErro(
      'Informe o valor da venda.'
    );

    return;

  }


  /*
   * Aceita:
   * 30
   * 30,00
   * 30.00
   * 1.250,50
   */

  let valorNormalizado =
    valorTexto
      .replace(
        /R\$/gi,
        ''
      )
      .trim();


  if (
    valorNormalizado.includes(',')
  ) {

    valorNormalizado =
      valorNormalizado
        .replace(
          /\./g,
          ''
        )
        .replace(
          ',',
          '.'
        );

  }


  const valor =
    parseFloat(
      valorNormalizado
    );


  if (
    isNaN(valor) ||
    valor <= 0
  ) {

    mostrarErro(
      'O valor da venda é inválido.'
    );

    return;

  }


  const btn =
    document
      .getElementById(
        'btnSalvar'
      );


  btn.disabled =
    true;


  btn.textContent =
    '⏳ SALVANDO...';


  voiceStatus.textContent =
    '💳 Salvando venda e gerando Pix...';


  api(
    'registrarVenda',
    {

      cliente:
        cliente ||
        'Cliente não informado',

      descricao:
        descricao,

      valor:
        valor.toFixed(2)

    },

    function(resultado) {

      console.log(
        'Salvar:',
        resultado
      );


      btn.disabled =
        false;


      btn.textContent =
        '💳 SALVAR E GERAR PIX';


      if (
        !resultado
      ) {

        mostrarErro(
          'O servidor não retornou resposta.'
        );

        return;

      }


      if (
        resultado.success !==
        true
      ) {

        mostrarErro(
          resultado.erro ||
          'Não foi possível salvar a venda.'
        );

        return;

      }


      document
        .getElementById(
          'idVenda'
        )
        .value =
        resultado.idVenda ||
        '';


      const pix =
        resultado.pixCode ||
        '';


      if (!pix) {

        mostrarErro(
          'Venda salva, mas o Pix não foi retornado.'
        );

        return;

      }


      document
        .getElementById(
          'pixCode'
        )
        .textContent =
        pix;


      /*
       * QR CODE
       */

      const qr =
        document.getElementById(
          'qrCode'
        );


      qr.src =
        'https://api.qrserver.com/v1/create-qr-code/' +
        '?size=300x300&data=' +
        encodeURIComponent(
          pix
        );


      document
        .getElementById(
          'mensagemResultado'
        )
        .textContent =
        'Venda ' +
        resultado.idVenda +
        ' registrada com sucesso. ' +
        'Pix gerado no valor de R$ ' +
        valor
          .toFixed(2)
          .replace(
            '.',
            ','
          ) +
        '.';


      document
        .getElementById(
          'resultado'
        )
        .style
        .display =
        'block';


      mostrarSucesso(
        '✅ Venda salva e Pix gerado!'
      );


      voiceStatus.textContent =
        '✅ Venda salva com sucesso!';

    }

  );

}


/*******************************************************
 * API JSONP
 *******************************************************/

function api(
  action,
  dados,
  callback
) {

  if (
    !API_URL ||
    !API_URL.includes(
      'script.google.com'
    )
  ) {

    mostrarErro(
      'A URL do Apps Script está incorreta.'
    );

    return;

  }


  const callbackName =
    'vendasIA_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  let finalizado =
    false;


  let script =
    null;


  const timeout =
    setTimeout(
      function() {

        if (
          finalizado
        ) {
          return;
        }


        finalizado =
          true;


        delete window[
          callbackName
        ];


        if (
          script &&
          script.parentNode
        ) {

          script
            .parentNode
            .removeChild(
              script
            );

        }


        mostrarErro(
          'Tempo esgotado ao comunicar com o Google Apps Script.'
        );

      },
      30000
    );


  window[callbackName] =
    function(resultado) {

      if (
        finalizado
      ) {
        return;
      }


      finalizado =
        true;


      clearTimeout(
        timeout
      );


      try {

        callback(
          resultado
        );

      } catch (erro) {

        console.error(
          erro
        );

        mostrarErro(
          'Erro ao processar a resposta do servidor.'
        );

      }


      delete window[
        callbackName
      ];


      if (
        script &&
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }

    };


  const params =
    new URLSearchParams();


  params.set(
    'action',
    action
  );


  params.set(
    'callback',
    callbackName
  );


  if (dados) {

    Object.keys(
      dados
    ).forEach(
      function(chave) {

        const valor =
          dados[chave];


        if (
          valor !==
          undefined &&
          valor !==
          null
        ) {

          params.set(
            chave,
            String(valor)
          );

        }

      }
    );

  }


  const url =
    API_URL +
    (
      API_URL.includes('?')
        ? '&'
        : '?'
    ) +
    params.toString();


  console.log(
    'Chamando API:',
    url
  );


  script =
    document.createElement(
      'script'
    );


  script.src =
    url;


  script.async =
    true;


  script.onerror =
    function() {

      if (
        finalizado
      ) {
        return;
      }


      finalizado =
        true;


      clearTimeout(
        timeout
      );


      delete window[
        callbackName
      ];


      if (
        script &&
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }


      mostrarErro(
        'Não consegui conectar ao Google Apps Script. Verifique a implantação do Web App.'
      );

    };


  document
    .head
    .appendChild(
      script
    );

}


/*******************************************************
 * COPIAR PIX
 *******************************************************/

function copiarPix() {

  const pix =
    document
      .getElementById(
        'pixCode'
      )
      .textContent
      .trim();


  if (!pix) {

    mostrarErro(
      'Não existe Pix para copiar.'
    );

    return;

  }


  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard
      .writeText(
        pix
      )
      .then(
        function() {

          mostrarSucesso(
            '📋 Pix copiado!'
          );

        }
      )
      .catch(
        function() {

          copiarPixAntigo(
            pix
          );

        }
      );

    return;

  }


  copiarPixAntigo(
    pix
  );

}


function copiarPixAntigo(
  texto
) {

  const area =
    document.createElement(
      'textarea'
    );


  area.value =
    texto;


  area.style.position =
    'fixed';

  area.style.left =
    '-9999px';


  document
    .body
    .appendChild(
      area
    );


  area.select();


  try {

    document.execCommand(
      'copy'
    );


    mostrarSucesso(
      '📋 Pix copiado!'
    );

  } catch (erro) {

    mostrarErro(
      'Selecione o código Pix manualmente.'
    );

  }


  document
    .body
    .removeChild(
      area
    );
}


/*******************************************************
 * LIMPAR
 *******************************************************/

function limparTela() {

  document
    .getElementById(
      'cliente'
    )
    .value =
    '';


  document
    .getElementById(
      'descricao'
    )
    .value =
    '';


  document
    .getElementById(
      'valor'
    )
    .value =
    '';


  document
    .getElementById(
      'idVenda'
    )
    .value =
    '';


  document
    .getElementById(
      'transcript'
    )
    .textContent =
    'A fala reconhecida aparecerá aqui.';


  document
    .getElementById(
      'produtos'
    )
    .innerHTML =
    '';


  document
    .getElementById(
      'resultado'
    )
    .style
    .display =
    'none';


  esconderErro();


  document
    .getElementById(
      'sucesso'
    )
    .style
    .display =
    'none';


  voiceStatus.textContent =
    'Clique no microfone e fale a venda.';
}


/*******************************************************
 * MENSAGENS
 *******************************************************/

function mostrarErro(
  mensagem
) {

  const erro =
    document.getElementById(
      'erro'
    );


  erro.textContent =
    '❌ ' + mensagem;


  erro.style.display =
    'block';


  document
    .getElementById(
      'sucesso'
    )
    .style
    .display =
    'none';
}


function esconderErro() {

  document
    .getElementById(
      'erro'
    )
    .style
    .display =
    'none';
}


function mostrarSucesso(
  mensagem
) {

  const sucesso =
    document.getElementById(
      'sucesso'
    );


  sucesso.textContent =
    mensagem;


  sucesso.style.display =
    'block';


  document
    .getElementById(
      'erro'
    )
    .style
    .display =
    'none';
}
