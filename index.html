<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Vendas IA + Pix</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      padding: 20px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f4f6f8;

      color: #222;

    }

    .container {

      width: 100%;

      max-width: 650px;

      margin: auto;

    }

    .card {

      background: white;

      border-radius: 18px;

      padding: 22px;

      box-shadow:
        0 5px 25px
        rgba(0,0,0,.08);

    }

    h1 {

      text-align: center;

      margin-top: 0;

      font-size: 25px;

    }

    .subtitulo {

      text-align: center;

      color: #666;

      margin-bottom: 25px;

    }

    label {

      display: block;

      font-weight: bold;

      margin-top: 15px;

      margin-bottom: 6px;

    }

    input,
    textarea {

      width: 100%;

      padding: 13px;

      border: 1px solid #ddd;

      border-radius: 10px;

      font-size: 16px;

      outline: none;

    }

    input:focus,
    textarea:focus {

      border-color: #777;

    }

    textarea {

      min-height: 80px;

      resize: vertical;

    }

    .voz-area {

      text-align: center;

      padding: 15px 0 20px;

    }

    #voiceBtn {

      width: 90px;

      height: 90px;

      border-radius: 50%;

      border: none;

      background: #111;

      color: white;

      font-size: 36px;

      cursor: pointer;

      box-shadow:
        0 6px 18px
        rgba(0,0,0,.20);

      transition: .2s;

    }

    #voiceBtn:hover {

      transform: scale(1.04);

    }

    #voiceBtn.recording {

      background: #d62828;

      animation:
        pulsar 1.2s
        infinite;

    }

    @keyframes pulsar {

      0% {
        box-shadow:
          0 0 0 0
          rgba(214,40,40,.6);
      }

      70% {
        box-shadow:
          0 0 0 22px
          rgba(214,40,40,0);
      }

      100% {
        box-shadow:
          0 0 0 0
          rgba(214,40,40,0);
      }

    }

    #voiceStatus {

      margin-top: 12px;

      font-weight: bold;

      min-height: 24px;

    }

    .transcricao {

      background: #f0f2f4;

      border-radius: 12px;

      padding: 14px;

      margin-top: 12px;

      min-height: 50px;

      color: #333;

    }

    .ajuda {

      margin-top: 10px;

      font-size: 14px;

      color: #777;

      line-height: 1.5;

    }

    .linha {

      display: grid;

      grid-template-columns:
        1fr 1fr;

      gap: 12px;

    }

    button {

      border: none;

      border-radius: 10px;

      padding: 14px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;

    }

    .btnSalvar {

      width: 100%;

      margin-top: 20px;

      background: #16803c;

      color: white;

      font-size: 18px;

    }

    .btnSalvar:disabled {

      background: #aaa;

      cursor: not-allowed;

    }

    .btnLimpar {

      width: 100%;

      margin-top: 10px;

      background: #eee;

      color: #333;

    }

    .resultado {

      display: none;

      margin-top: 22px;

      padding: 18px;

      border-radius: 14px;

      background: #eef8f1;

      border: 1px solid #b7dfc2;

    }

    .resultado h2 {

      margin-top: 0;

      font-size: 20px;

    }

    .pix {

      background: white;

      border: 1px solid #ddd;

      border-radius: 10px;

      padding: 12px;

      margin-top: 12px;

      word-break: break-all;

      font-size: 13px;

    }

    .btnCopiar {

      width: 100%;

      margin-top: 10px;

      background: #222;

      color: white;

    }

    .erro {

      background: #fff0f0;

      border: 1px solid #e5aaaa;

      color: #9d1c1c;

      padding: 14px;

      border-radius: 10px;

      margin-top: 15px;

      display: none;

    }

    .sucesso {

      background: #edf9f0;

      border: 1px solid #b8dfc1;

      color: #16652d;

      padding: 14px;

      border-radius: 10px;

      margin-top: 15px;

      display: none;

    }

    .produtos {

      margin-top: 15px;

    }

    .produto {

      background: #f6f6f6;

      padding: 10px;

      border-radius: 9px;

      margin-bottom: 8px;

    }

    .qr {

      text-align: center;

      margin-top: 15px;

    }

    .qr img {

      width: 220px;

      height: 220px;

      max-width: 100%;

    }

    @media(max-width: 550px) {

      body {

        padding: 10px;

      }

      .card {

        padding: 16px;

      }

      .linha {

        grid-template-columns: 1fr;

      }

    }

  </style>

</head>


<body>

<div class="container">

  <div class="card">

    <h1>💰 Vendas IA + Pix</h1>

    <div class="subtitulo">
      Registre sua venda falando
    </div>


    <!-- VOZ -->

    <div class="voz-area">

      <button
        id="voiceBtn"
        onclick="iniciarVoz()"
      >
        🎤
      </button>

      <div id="voiceStatus">
        Clique no microfone e fale a venda
      </div>

      <div
        id="transcript"
        class="transcricao"
      >
        A fala reconhecida aparecerá aqui.
      </div>

      <div class="ajuda">

        Exemplo:<br>

        <b>
          "Venda para João, dois pastéis
          e uma Coca-Cola, total de
          trinta reais."
        </b>

      </div>

    </div>


    <!-- ERRO -->

    <div
      id="erro"
      class="erro"
    ></div>


    <!-- SUCESSO -->

    <div
      id="sucesso"
      class="sucesso"
    ></div>


    <!-- DADOS -->

    <label>
      Cliente
    </label>

    <input
      id="cliente"
      type="text"
      placeholder="Nome do cliente"
    >


    <label>
      Descrição da venda
    </label>

    <textarea
      id="descricao"
      placeholder="Descrição da venda"
    ></textarea>


    <div class="linha">

      <div>

        <label>
          Valor total
        </label>

        <input
          id="valor"
          type="number"
          step="0.01"
          min="0"
          placeholder="0,00"
        >

      </div>

      <div>

        <label>
          ID da venda
        </label>

        <input
          id="idVenda"
          type="text"
          placeholder="Será criado automaticamente"
          readonly
        >

      </div>

    </div>


    <!-- PRODUTOS -->

    <div
      id="produtos"
      class="produtos"
    ></div>


    <!-- SALVAR -->

    <button
      id="btnSalvar"
      class="btnSalvar"
      onclick="salvarVenda()"
    >
      💳 SALVAR E GERAR PIX
    </button>


    <button
      class="btnLimpar"
      onclick="limparTela()"
    >
      🧹 LIMPAR
    </button>


    <!-- RESULTADO PIX -->

    <div
      id="resultado"
      class="resultado"
    >

      <h2>
        ✅ Venda salva!
      </h2>

      <div id="mensagemResultado"></div>


      <div class="qr">

        <img
          id="qrCode"
          alt="QR Code Pix"
        >

      </div>


      <div
        class="pix"
        id="pixCode"
      ></div>


      <button
        class="btnCopiar"
        onclick="copiarPix()"
      >
        📋 COPIAR PIX
      </button>

    </div>

  </div>

</div>


<script>


/********************************************************
 * CONFIGURAÇÃO
 ********************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbxRzKlZx9fPdh-5SzqCMvHchxnoqxecj_VeV90eoUpyRBPsnQ2fwTpp3VcM8Rx0YlnrCA/exec';


/********************************************************
 * VARIÁVEIS
 ********************************************************/

let reconhecimento = null;

let gravando = false;


/********************************************************
 * ELEMENTOS
 ********************************************************/

const voiceBtn =
  document.getElementById(
    'voiceBtn'
  );


const voiceStatus =
  document.getElementById(
    'voiceStatus'
  );


const transcript =
  document.getElementById(
    'transcript'
  );


/********************************************************
 * INICIAR VOZ
 ********************************************************/

function iniciarVoz() {


  /*
   * Verifica navegador
   */

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    mostrarErro(
      'Seu navegador não suporta reconhecimento de voz. ' +
      'Use o Google Chrome.'
    );

    return;

  }


  /*
   * Se já estiver gravando,
   * para a gravação.
   */

  if (gravando) {

    if (reconhecimento) {

      reconhecimento.stop();

    }

    return;

  }


  /*
   * Cria novo reconhecimento
   */

  reconhecimento =
    new SpeechRecognition();


  /*
   * Português do Brasil
   */

  reconhecimento.lang =
    'pt-BR';


  /*
   * Uma fala por vez
   */

  reconhecimento.continuous =
    false;


  /*
   * Mostra texto provisório
   */

  reconhecimento.interimResults =
    true;


  reconhecimento.maxAlternatives =
    3;


  /*
   * COMEÇOU
   */

  reconhecimento.onstart =
    function() {

      gravando = true;


      voiceBtn
        .classList
        .add('recording');


      voiceBtn.textContent =
        '⏹️';


      voiceStatus.textContent =
        '🔴 Ouvindo... fale a venda';


      transcript.textContent =
        'Estou ouvindo...';


      esconderErro();

    };


  /*
   * RESULTADO
   */

  reconhecimento.onresult =
    function(event) {


      let textoFinal =
        '';


      let textoParcial =
        '';


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {


        const resultado =
          event.results[i];


        const texto =
          resultado[0]
            .transcript;


        if (
          resultado.isFinal
        ) {

          textoFinal +=
            texto;

        } else {

          textoParcial +=
            texto;

        }

      }


      /*
       * Mostrar na tela
       */

      const textoTela =
        (
          textoFinal ||
          textoParcial
        ).trim();


      if (textoTela) {

        transcript.textContent =
          textoTela;

      }


      /*
       * Só interpreta quando
       * a fala terminou.
       */

      if (
        textoFinal.trim()
      ) {

        voiceStatus.textContent =
          '🤖 Entendi sua fala. Analisando...';


        interpretarIA(
          textoFinal.trim()
        );

      }

    };


  /*
   * ERRO
   */

  reconhecimento.onerror =
    function(event) {


      console.error(
        'SpeechRecognition:',
        event.error
      );


      finalizarVoz();


      let mensagem =
        'Erro no reconhecimento de voz.';


      switch (
        event.error
      ) {


        case 'not-allowed':

          mensagem =
            '🚫 O microfone está bloqueado. ' +
            'Permita o acesso ao microfone no navegador.';

          break;


        case 'no-speech':

          mensagem =
            '🎤 Não detectei nenhuma fala. ' +
            'Clique novamente e fale mais perto do microfone.';

          break;


        case 'audio-capture':

          mensagem =
            '🎤 Não consegui acessar o microfone. ' +
            'Verifique se existe um microfone conectado.';

          break;


        case 'network':

          mensagem =
            '🌐 O reconhecimento de voz apresentou um erro de rede.';

          break;


        case 'aborted':

          mensagem =
            'Gravação interrompida.';

          break;

      }


      mostrarErro(
        mensagem
      );

    };


  /*
   * TERMINOU
   */

  reconhecimento.onend =
    function() {

      finalizarVoz();

    };


  /*
   * COMEÇA O MICROFONE
   */

  try {

    reconhecimento.start();

  } catch (erro) {

    console.error(
      erro
    );


    finalizarVoz();


    mostrarErro(
      'Não foi possível iniciar o microfone.'
    );

  }

}


/********************************************************
 * FINALIZAR VOZ
 ********************************************************/

function finalizarVoz() {

  gravando = false;


  voiceBtn
    .classList
    .remove('recording');


  voiceBtn.textContent =
    '🎤';

}


/********************************************************
 * INTERPRETAR COM IA
 ********************************************************/

function interpretarIA(
  texto
) {


  if (!texto) {

    mostrarErro(
      'Não recebi o texto da sua fala.'
    );

    return;

  }


  voiceStatus.textContent =
    '🤖 Analisando a venda...';


  /*
   * Chamada ao Apps Script
   */

  api(
    'interpretarVenda',
    {
      texto: texto
    },

    function(resultado) {


      console.log(
        'Resposta da IA:',
        resultado
      );


      if (!resultado) {

        mostrarErro(
          'O servidor não retornou nenhuma resposta.'
        );

        return;

      }


      if (
        resultado.success === false &&
        resultado.erro
      ) {

        mostrarErro(
          resultado.erro
        );

        voiceStatus.textContent =
          '⚠️ Não foi possível interpretar a venda.';

        return;

      }


      if (
        resultado.erro
      ) {


        if (
          resultado.erro ===
          'valor_ausente'
        ) {

          mostrarErro(
            'Não encontrei o valor da venda. ' +
            'Fale também o valor total.'
          );

        } else if (
          resultado.erro ===
          'nao_e_venda'
        ) {

          mostrarErro(
            'Não identifiquei uma venda. ' +
            'Fale o cliente, os produtos e o valor.'
          );

        } else {

          mostrarErro(
            resultado.erro
          );

        }


        voiceStatus.textContent =
          '⚠️ Venda não identificada.';

        return;

      }


      /*
       * Preencher campos
       */

      document
        .getElementById(
          'cliente'
        )
        .value =
        resultado.cliente ||
        '';


      document
        .getElementById(
          'descricao'
        )
        .value =
        resultado.descricao ||
        '';


      document
        .getElementById(
          'valor'
        )
        .value =
        resultado.valor ||
        '';


      /*
       * Produtos
       */

      mostrarProdutos(
        resultado.produtos ||
        []
      );


      voiceStatus.textContent =
        '✅ Venda identificada! Confira os dados.';


      esconderErro();


      mostrarSucesso(
        'A venda foi identificada. ' +
        'Confira os dados antes de salvar.'
      );

    }

  );

}


/********************************************************
 * MOSTRAR PRODUTOS
 ********************************************************/

function mostrarProdutos(
  produtos
) {


  const div =
    document.getElementById(
      'produtos'
    );


  div.innerHTML =
    '';


  if (
    !produtos ||
    !produtos.length
  ) {

    return;

  }


  const titulo =
    document.createElement(
      'div'
    );


  titulo.innerHTML =
    '<b>🛒 Produtos identificados:</b>';


  div.appendChild(
    titulo
  );


  produtos.forEach(
    function(produto) {


      const item =
        document.createElement(
          'div'
        );


      item.className =
        'produto';


      const nome =
        produto.nome ||
        'Produto';


      const quantidade =
        produto.quantidade ||
        1;


      const valorTotal =
        produto.valorTotal;


      let texto =
        '🛒 ' +
        quantidade +
        'x ' +
        nome;


      if (
        valorTotal !==
        undefined
      ) {

        texto +=
          ' — R$ ' +
          Number(
            valorTotal
          )
          .toFixed(2)
          .replace(
            '.',
            ','
          );

      }


      item.textContent =
        texto;


      div.appendChild(
        item
      );

    }
  );

}


/********************************************************
 * SALVAR VENDA
 ********************************************************/

function salvarVenda() {


  esconderErro();


  const cliente =
    document
      .getElementById(
        'cliente'
      )
      .value
      .trim();


  const descricao =
    document
      .getElementById(
        'descricao'
      )
      .value
      .trim();


  const valorTexto =
    document
      .getElementById(
        'valor'
      )
      .value
      .trim();


  /*
   * Validação
   */

  if (!descricao) {

    mostrarErro(
      'Digite ou dite a descrição da venda.'
    );

    return;

  }


  if (!valorTexto) {

    mostrarErro(
      'Informe o valor da venda.'
    );

    return;

  }


  const valor =
    parseFloat(
      valorTexto
        .replace(
          ',',
          '.'
        )
    );


  if (
    isNaN(valor) ||
    valor <= 0
  ) {

    mostrarErro(
      'O valor da venda é inválido.'
    );

    return;

  }


  /*
   * Desabilitar botão
   */

  const btn =
    document
      .getElementById(
        'btnSalvar'
      );


  btn.disabled =
    true;


  btn.textContent =
    '⏳ SALVANDO...';


  voiceStatus.textContent =
    '💳 Salvando venda e gerando Pix...';


  /*
   * Enviar para Apps Script
   */

  api(
    'registrarVenda',
    {

      cliente:
        cliente ||
        'Cliente não informado',

      descricao:
        descricao,

      valor:
        valor.toFixed(2)

    },

    function(resultado) {


      console.log(
        'Resposta do salvamento:',
        resultado
      );


      btn.disabled =
        false;


      btn.textContent =
        '💳 SALVAR E GERAR PIX';


      if (!resultado) {

        mostrarErro(
          'O servidor não retornou resposta.'
        );

        return;

      }


      if (
        resultado.success !==
        true
      ) {

        mostrarErro(
          resultado.erro ||
          resultado.message ||
          'Não foi possível salvar a venda.'
        );

        return;

      }


      /*
       * ID
       */

      document
        .getElementById(
          'idVenda'
        )
        .value =
        resultado.idVenda ||
        '';


      /*
       * Pix
       */

      const pix =
        resultado.pixCode ||
        '';


      if (!pix) {

        mostrarErro(
          'A venda foi salva, mas o servidor não retornou o Pix.'
        );

        return;

      }


      document
        .getElementById(
          'pixCode'
        )
        .textContent =
        pix;


      /*
       * QR CODE
       */

      const qr =
        document
          .getElementById(
            'qrCode'
          );


      qr.src =
        'https://api.qrserver.com/v1/create-qr-code/' +
        '?size=300x300&data=' +
        encodeURIComponent(
          pix
        );


      /*
       * Resultado
       */

      document
        .getElementById(
          'mensagemResultado'
        )
        .textContent =
        'Venda ' +
        (resultado.idVenda || '') +
        ' registrada com sucesso. ' +
        'Pix gerado no valor de R$ ' +
        Number(
          valor
        )
        .toFixed(2)
        .replace(
          '.',
          ','
        ) +
        '.';


      document
        .getElementById(
          'resultado'
        )
        .style
        .display =
        'block';


      mostrarSucesso(
        '✅ Venda salva e Pix gerado!'
      );


      voiceStatus.textContent =
        '✅ Venda salva com sucesso!';

    }

  );

}


/********************************************************
 * API VIA JSONP
 *
 * Isso evita problemas de CORS entre
 * GitHub Pages e Google Apps Script.
 ********************************************************/

function api(
  action,
  dados,
  callback
) {


  /*
   * Verificar URL
   */

  if (
    !API_URL ||
    API_URL.indexOf(
      'script.google.com'
    ) === -1
  ) {

    mostrarErro(
      'A URL do Google Apps Script ainda não foi configurada no index.html.'
    );

    return;

  }


  /*
   * Nome único para callback
   */

  const callbackName =
    'callback_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() *
      100000
    );


  /*
   * Criar função global
   */

  window[callbackName] =
    function(resultado) {


      try {

        callback(
          resultado
        );

      } finally {

        /*
         * Limpar callback
         */

        delete window[
          callbackName
        ];

        if (
          script.parentNode
        ) {

          script
            .parentNode
            .removeChild(
              script
            );

        }

      }

    };


  /*
   * Criar URL
   */

  const params =
    new URLSearchParams();


  params.set(
    'action',
    action
  );


  params.set(
    'callback',
    callbackName
  );


  /*
   * Adicionar dados
   */

  if (dados) {

    Object.keys(
      dados
    ).forEach(
      function(chave) {

        params.set(
          chave,
          dados[chave]
        );

      }
    );

  }


  const url =
    API_URL +
    (
      API_URL.includes('?')
        ? '&'
        : '?'
    ) +
    params.toString();


  /*
   * Script JSONP
   */

  const script =
    document.createElement(
      'script'
    );


  script.src =
    url;


  script.async =
    true;


  /*
   * Timeout
   */

  const timeout =
    setTimeout(
      function() {


        delete window[
          callbackName
        ];


        if (
          script.parentNode
        ) {

          script
            .parentNode
            .removeChild(
              script
            );

        }


        mostrarErro(
          'Tempo esgotado ao comunicar com o Google Apps Script.'
        );


      },
      30000
    );


  /*
   * Se respondeu,
   * cancelar timeout
   */

  const callbackOriginal =
    window[callbackName];


  window[callbackName] =
    function(resultado) {


      clearTimeout(
        timeout
      );


      callbackOriginal(
        resultado
      );

    };


  /*
   * Erro de carregamento
   */

  script.onerror =
    function() {


      clearTimeout(
        timeout
      );


      delete window[
        callbackName
      ];


      if (
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }


      mostrarErro(
        'Não consegui conectar ao Google Apps Script. ' +
        'Confira a URL do Web App.'
      );

    };


  document
    .body
    .appendChild(
      script
    );

}


/********************************************************
 * COPIAR PIX
 ********************************************************/

function copiarPix() {


  const pix =
    document
      .getElementById(
        'pixCode'
      )
      .textContent
      .trim();


  if (!pix) {

    mostrarErro(
      'Não existe Pix para copiar.'
    );

    return;

  }


  /*
   * Navegadores modernos
   */

  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard
      .writeText(
        pix
      )
      .then(
        function() {

          mostrarSucesso(
            '📋 Pix copiado!'
          );

        }
      )
      .catch(
        function() {

          copiarPixAntigo(
            pix
          );

        }
      );

    return;

  }


  copiarPixAntigo(
    pix
  );

}


/********************************************************
 * COPIAR PIX - COMPATIBILIDADE
 ********************************************************/

function copiarPixAntigo(
  texto
) {


  const area =
    document.createElement(
      'textarea'
    );


  area.value =
    texto;


  area.style.position =
    'fixed';


  area.style.left =
    '-9999px';


  document
    .body
    .appendChild(
      area
    );


  area.select();


  try {

    document.execCommand(
      'copy'
    );


    mostrarSucesso(
      '📋 Pix copiado!'
    );

  } catch (erro) {

    mostrarErro(
      'Não consegui copiar automaticamente. ' +
      'Selecione o código Pix manualmente.'
    );

  }


  document
    .body
    .removeChild(
      area
    );

}


/********************************************************
 * LIMPAR
 ********************************************************/

function limparTela() {


  document
    .getElementById(
      'cliente'
    )
    .value =
    '';


  document
    .getElementById(
      'descricao'
    )
    .value =
    '';


  document
    .getElementById(
      'valor'
    )
    .value =
    '';


  document
    .getElementById(
      'idVenda'
    )
    .value =
    '';


  document
    .getElementById(
      'transcript'
    )
    .textContent =
    'A fala reconhecida aparecerá aqui.';


  document
    .getElementById(
      'produtos'
    )
    .innerHTML =
    '';


  document
    .getElementById(
      'resultado'
    )
    .style
    .display =
    'none';


  esconderErro();


  document
    .getElementById(
      'sucesso'
    )
    .style
    .display =
    'none';


  voiceStatus.textContent =
    'Clique no microfone e fale a venda.';

}


/********************************************************
 * MENSAGENS
 ********************************************************/

function mostrarErro(
  mensagem
) {


  const erro =
    document.getElementById(
      'erro'
    );


  erro.textContent =
    '❌ ' +
    mensagem;


  erro.style.display =
    'block';


  document
    .getElementById(
      'sucesso'
    )
    .style
    .display =
    'none';

}


function esconderErro() {


  document
    .getElementById(
      'erro'
    )
    .style
    .display =
    'none';

}


function mostrarSucesso(
  mensagem
) {


  const sucesso =
    document.getElementById(
      'sucesso'
    );


  sucesso.textContent =
    mensagem;


  sucesso.style.display =
    'block';


  document
    .getElementById(
      'erro'
    )
    .style
    .display =
    'none';

}


/********************************************************
 * VERIFICAR SUPORTE
 ********************************************************/

window.addEventListener(
  'load',
  function() {


    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (!SpeechRecognition) {

      voiceStatus.textContent =
        '⚠️ Seu navegador não suporta voz. Use o Google Chrome.';

    }

  }
);
