<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>Vendas IA + Pix</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 20px;

  font-family: Arial, Helvetica, sans-serif;

  background: #f4f6f8;

  color: #222;
}

.container {

  width: 100%;
  max-width: 650px;

  margin: auto;
}

.card {

  background: white;

  border-radius: 18px;

  padding: 22px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.08);
}

h1 {

  text-align: center;

  margin-top: 0;

  font-size: 25px;
}

.subtitulo {

  text-align: center;

  color: #666;

  margin-bottom: 25px;
}

label {

  display: block;

  font-weight: bold;

  margin-top: 15px;

  margin-bottom: 6px;
}

input,
textarea {

  width: 100%;

  padding: 13px;

  border: 1px solid #ddd;

  border-radius: 10px;

  font-size: 16px;

  outline: none;
}

textarea {

  min-height: 80px;

  resize: vertical;
}

.linha {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;
}

.voz-area {

  text-align: center;

  padding: 10px 0 20px;
}

#voiceBtn {

  width: 90px;

  height: 90px;

  border-radius: 50%;

  border: none;

  background: #111;

  color: white;

  font-size: 36px;

  cursor: pointer;
}

#voiceBtn.recording {

  background: #d62828;

  animation: pulsar 1.2s infinite;
}

@keyframes pulsar {

  0% {
    box-shadow: 0 0 0 0 rgba(214,40,40,.6);
  }

  70% {
    box-shadow: 0 0 0 22px rgba(214,40,40,0);
  }

  100% {
    box-shadow: 0 0 0 0 rgba(214,40,40,0);
  }
}

#voiceStatus {

  margin-top: 12px;

  font-weight: bold;

  min-height: 24px;
}

.voice-timer {

  margin-top: 8px;

  font-size: 22px;

  font-weight: bold;

  min-height: 28px;

}

.voice-timer.recording {

  color: #d62828;

}

.transcricao {

  background: #f0f2f4;

  border-radius: 12px;

  padding: 14px;

  margin-top: 12px;

  min-height: 50px;

  text-align: left;
}

.ajuda {

  margin-top: 10px;

  font-size: 14px;

  color: #777;

  line-height: 1.5;
}

button {

  border: none;

  border-radius: 10px;

  padding: 14px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

.btnSalvar {

  width: 100%;

  margin-top: 20px;

  background: #16803c;

  color: white;

  font-size: 18px;
}

.btnSalvar:disabled {

  background: #aaa;

  cursor: not-allowed;
}

.btnLimpar {

  width: 100%;

  margin-top: 10px;

  background: #eee;
}

.resultado {

  display: none;

  margin-top: 22px;

  padding: 18px;

  border-radius: 14px;

  background: #eef8f1;

  border: 1px solid #b7dfc2;
}

.pix {

  background: white;

  border: 1px solid #ddd;

  border-radius: 10px;

  padding: 12px;

  margin-top: 12px;

  word-break: break-all;

  font-size: 13px;
}

.btnCopiar {

  width: 100%;

  margin-top: 10px;

  background: #222;

  color: white;
}

.erro,
.sucesso {

  padding: 14px;

  border-radius: 10px;

  margin-top: 15px;
}

.erro {

  background: #fff0f0;

  border: 1px solid #e5aaaa;

  color: #9d1c1c;

  display: none;
}

.sucesso {

  background: #edf9f0;

  border: 1px solid #b8dfc1;

  color: #16652d;

  display: none;
}

.produto {

  background: #f6f6f6;

  padding: 10px;

  border-radius: 9px;

  margin-top: 8px;
}

.qr {

  text-align: center;

  margin-top: 15px;
}

.qr img {

  width: 220px;

  height: 220px;

  max-width: 100%;
}

/* STATUS DO PAGAMENTO */

.status-pagamento {
  text-align: center;
  margin-top: 18px;
  padding: 16px 14px;
  border-radius: 14px;
  background: #fff8e6;
  border: 1px solid #f0d98a;
}

.status-pagamento.confirmado {
  background: #edf9f0;
  border-color: #b8dfc1;
}

.status-titulo {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 6px;
}

.status-subtitulo {
  color: #666;
  font-size: 14px;
}

.cronometro {
  margin-top: 10px;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 1px;
}

.qr {
  text-align: center;
  margin-top: 15px;
}

.qr img {
  display: block;
  width: 220px;
  height: 220px;
  max-width: 100%;
  margin: 0 auto;
}

@media(max-width:550px) {

  body {
    padding: 10px;
  }

  .card {
    padding: 16px;
  }

  .linha {
    grid-template-columns: 1fr;
  }
}

</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>💰 Vendas IA + Pix</h1>

<div class="subtitulo">
Registre sua venda falando
</div>


<!-- VOZ -->

<div class="voz-area">

<button

  onclick="iniciarVoz()"

🎤
</button>

<div id="voiceStatus">
Clique no microfone e fale a venda
</div>

<div id="voiceTimer" class="voice-timer">
01:00

A fala reconhecida aparecerá aqui.

Exemplo:

<input

<textarea

  <div id="statusTitulo" class="status-titulo">⏳ AGUARDANDO CONFIRMAÇÃO</div>
  <div id="statusSubtitulo" class="status-subtitulo">Aguardando o e-mail do Nubank.</div>
  <div id="cronometro" class="cronometro">05:00</div>
</div>

<div class="qr">

<img
  id="qrCode"

>

</div>

<div
  id="pixCode"

></div>

<button
  class="btnCopiar"
  onclick="copiarPix()"
>
📋 COPIAR PIX

</div>

<script>

/*******************************************************
 * URL DO SEU WEB APP
 *******************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbz4eBNi9KD15hegoD7ilbNfOYFTylXDw4mCAj5ily5X8pIak8v4RUtKYvWL8wadquRThw/exec';

const TEMPO_MONITORAMENTO_MS = 5 * 60 * 1000;
const INTERVALO_MONITORAMENTO_MS = 10 * 1000;
let monitoramentoAtivo = false;
let monitoramentoInicio = 0;
let timerCronometro = null;
let timerVerificacao = null;


/*******************************************************
 * VOZ
 *
 * ATÉ 60 SEGUNDOS DE FALA.
 *
 * O reconhecimento pode ser encerrado pelo navegador antes
 * dos 60 segundos. Enquanto ainda houver tempo, a sessão é
 * reiniciada automaticamente e o texto já reconhecido é
 * preservado.
 *******************************************************/

const TEMPO_MAXIMO_VOZ_MS = 60 * 1000;

let reconhecimento = null;
let gravando = false;
let textoReconhecido = '';
let textoFinalVoz = '';
let inicioVoz = 0;
let timerVoz = null;
let encerramentoVozSolicitado = false;


const voiceBtn =
  document.getElementById(
    'voiceBtn'
  );

const voiceStatus =
  document.getElementById(
    'voiceStatus'
  );

const voiceTimer =
  document.getElementById(
    'voiceTimer'
  );

const transcript =
  document.getElementById(
    'transcript'
  );


function iniciarVoz() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    mostrarErro(
      'Seu navegador não suporta reconhecimento de voz. Use o Google Chrome.'
    );

    return;

  }


  if (gravando) {

    /*
     * Segundo clique = encerra a fala imediatamente.
     */

    encerramentoVozSolicitado = true;

    if (reconhecimento) {

      try {
        reconhecimento.stop();
      } catch (erro) {
        console.error(erro);
      }

    }

    return;

  }


  pararTimerVoz();

  textoReconhecido = '';
  textoFinalVoz = '';
  inicioVoz = Date.now();
  encerramentoVozSolicitado = false;

  transcript.textContent =
    'Estou ouvindo...';

  atualizarTimerVoz();

  iniciarSessaoVoz(
    SpeechRecognition
  );


  timerVoz = setInterval(
    function() {

      atualizarTimerVoz();

      if (
        Date.now() - inicioVoz >=
        TEMPO_MAXIMO_VOZ_MS
      ) {

        encerrarVozPorTempo();

      }

    },
    250
  );

}


function iniciarSessaoVoz(
  SpeechRecognition
) {

  if (
    encerramentoVozSolicitado ||
    !inicioVoz
  ) {
    return;
  }


  const tempoDecorrido =
    Date.now() - inicioVoz;


  if (
    tempoDecorrido >=
    TEMPO_MAXIMO_VOZ_MS
  ) {

    encerrarVozPorTempo();
    return;

  }


  reconhecimento =
    new SpeechRecognition();


  reconhecimento.lang =
    'pt-BR';


  reconhecimento.continuous =
    true;


  reconhecimento.interimResults =
    true;


  reconhecimento.maxAlternatives =
    1;


  reconhecimento.onstart =
    function() {

      gravando = true;

      voiceBtn.classList.add(
        'recording'
      );

      voiceBtn.textContent =
        '⏹️';

      voiceStatus.textContent =
        '🔴 Ouvindo... fale a venda';

      voiceTimer.classList.add(
        'recording'
      );

      esconderErro();

    };


  reconhecimento.onresult =
    function(event) {

      let textoInterino = '';


      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        const texto =
          event.results[i][0]
            .transcript
            .trim();


        if (!texto) {
          continue;
        }


        if (
          event.results[i].isFinal
        ) {

          textoFinalVoz +=
            (
              textoFinalVoz
                ? ' '
                : ''
            ) + texto;

        } else {

          textoInterino +=
            (
              textoInterino
                ? ' '
                : ''
            ) + texto;

        }

      }


      textoFinalVoz =
        textoFinalVoz.trim();

      textoReconhecido =
        (
          textoFinalVoz +
          (
            textoInterino
              ? ' ' + textoInterino
              : ''
          )
        ).trim();


      if (textoReconhecido) {

        transcript.textContent =
          textoReconhecido;

      }

    };


  reconhecimento.onerror =
    function(event) {

      console.error(
        'Erro de voz:',
        event.error
      );


      if (
        event.error ===
        'not-allowed'
      ) {

        encerramentoVozSolicitado = true;
        finalizarVoz();

        mostrarErro(
          '🚫 Permita o acesso ao microfone no navegador.'
        );

        return;

      }


      if (
        event.error ===
        'audio-capture'
      ) {

        encerramentoVozSolicitado = true;
        finalizarVoz();

        mostrarErro(
          '🎤 Não consegui acessar o microfone.'
        );

        return;

      }


      if (
        event.error ===
        'no-speech'
      ) {

        /*
         * Não interrompe a janela de 60 segundos.
         * O onend reinicia a sessão se necessário.
         */

        return;

      }


      if (
        event.error ===
        'aborted'
      ) {

        return;

      }


      encerramentoVozSolicitado = true;
      finalizarVoz();

      mostrarErro(
        'Erro no reconhecimento de voz: ' +
        event.error
      );

    };


  reconhecimento.onend =
    function() {

      const tempoDecorrido =
        Date.now() - inicioVoz;


      if (
        !encerramentoVozSolicitado &&
        tempoDecorrido <
          TEMPO_MAXIMO_VOZ_MS
      ) {

        /*
         * O navegador encerrou a sessão antes de 60 segundos.
         * Reinicia automaticamente e mantém o texto acumulado.
         */

        setTimeout(
          function() {

            iniciarSessaoVoz(
              SpeechRecognition
            );

          },
          100
        );

        return;

      }


      finalizarVoz();


      /*
       * Só envia para a IA depois que a gravação terminou.
       */

      if (
        textoFinalVoz.trim()
      ) {

        interpretarIA(
          textoFinalVoz.trim()
        );

      } else {

        mostrarErro(
          '🎤 Não detectei sua fala. Clique novamente e fale a venda.'
        );

      }

    };


  try {

    reconhecimento.start();

  } catch (erro) {

    console.error(
      erro
    );

    if (
      !encerramentoVozSolicitado &&
      Date.now() - inicioVoz <
        TEMPO_MAXIMO_VOZ_MS
    ) {

      setTimeout(
        function() {

          iniciarSessaoVoz(
            SpeechRecognition
          );

        },
        150
      );

    } else {

      finalizarVoz();

    }

  }

}


function encerrarVozPorTempo() {

  if (!inicioVoz) {
    return;
  }


  encerramentoVozSolicitado = true;

  atualizarTimerVoz();
  pararTimerVoz();

  voiceStatus.textContent =
    '⏱️ 1 minuto concluído. Finalizando a fala...';


  if (reconhecimento) {

    try {
      reconhecimento.stop();
    } catch (erro) {
      console.error(erro);
      finalizarVoz();
    }

  } else {

    finalizarVoz();

    if (
      textoFinalVoz.trim()
    ) {

      interpretarIA(
        textoFinalVoz.trim()
      );

    }

  }

}


function atualizarTimerVoz() {

  if (
    !voiceTimer ||
    !inicioVoz
  ) {
    return;
  }


  const restante = Math.max(
    0,
    TEMPO_MAXIMO_VOZ_MS -
      (Date.now() - inicioVoz)
  );


  const totalSegundos =
    Math.ceil(
      restante / 1000
    );


  const minutos =
    Math.floor(
      totalSegundos / 60
    );


  const segundos =
    totalSegundos % 60;


  voiceTimer.textContent =
    String(minutos).padStart(2, '0') +
    ':' +
    String(segundos).padStart(2, '0');


  if (
    totalSegundos <= 0
  ) {

    voiceTimer.textContent =
      '00:00';

  }

}


function pararTimerVoz() {

  if (timerVoz) {

    clearInterval(
      timerVoz
    );

    timerVoz = null;

  }

}


function finalizarVoz() {

  pararTimerVoz();

  gravando =
    false;

  inicioVoz = 0;

  encerramentoVozSolicitado =
    false;

  if (voiceBtn) {

    voiceBtn.classList.remove(
      'recording'
    );

    voiceBtn.textContent =
      '🎤';

  }

  if (voiceTimer) {

    voiceTimer.classList.remove(
      'recording'
    );

    voiceTimer.textContent =
      '01:00';

  }

}


/*******************************************************
 * INTERPRETAR IA
 *******************************************************/

function interpretarIA(
  texto
) {

  if (!texto) {

    mostrarErro(
      'Não recebi o texto da sua fala.'
    );

    return;

  }


  voiceStatus.textContent =
    '🤖 Analisando a venda...';


  api(
    'interpretarVenda',
    {
      texto: texto
    },

    function(resultado) {

      console.log(
        'IA:',
        resultado
      );


      if (
        !resultado
      ) {

        mostrarErro(
          'O servidor não retornou resposta.'
        );

        return;

      }


      if (
        resultado.success === false &&
        resultado.erro
      ) {

        mostrarErro(
          resultado.erro
        );

        return;

      }


      if (
        resultado.erro
      ) {

        if (
          resultado.erro ===
          'valor_ausente'
        ) {

          mostrarErro(
            'Não encontrei o valor total. Fale o valor da venda.'
          );

        } else {

          mostrarErro(
            'Não consegui identificar a venda.'
          );

        }

        return;

      }


      /*
       * PREENCHER CAMPOS
       */

      document
        .getElementById(
          'cliente'
        )
        .value =
        resultado.cliente ||
        '';


      document
        .getElementById(
          'descricao'
        )
        .value =
        resultado.descricao ||
        '';


      if (
        resultado.valor !==
        undefined
      ) {

        document
          .getElementById(
            'valor'
          )
          .value =
          String(
            resultado.valor
          )
          .replace(
            '.',
            ','
          );

      }


      mostrarProdutos(
        resultado.produtos ||
        []
      );


      voiceStatus.textContent =
        '✅ Venda identificada! Confira os dados.';


      mostrarSucesso(
        'A venda foi identificada. Agora clique em SALVAR E GERAR PIX.'
      );

    }

  );

}


/*******************************************************
 * PRODUTOS
 *******************************************************/

function mostrarProdutos(
  produtos
) {

  const div =
    document.getElementById(
      'produtos'
    );


  div.innerHTML =
    '';


  if (
    !Array.isArray(produtos) ||
    produtos.length === 0
  ) {

    return;

  }


  const titulo =
    document.createElement(
      'div'
    );


  titulo.innerHTML =
    '<b>🛒 Produtos identificados:</b>';


  div.appendChild(
    titulo
  );


  produtos.forEach(
    function(produto) {

      const item =
        document.createElement(
          'div'
        );


      item.className =
        'produto';


      const nome =
        produto.nome ||
        'Produto';


      const quantidade =
        produto.quantidade ||
        1;


      let texto =
        '🛒 ' +
        quantidade +
        'x ' +
        nome;


      if (
        produto.valorTotal !==
        undefined
      ) {

        texto +=
          ' — R$ ' +
          Number(
            produto.valorTotal
          )
          .toFixed(2)
          .replace(
            '.',
            ','
          );

      }


      item.textContent =
        texto;


      div.appendChild(
        item
      );

    }
  );

}


/*******************************************************
 * SALVAR
 *******************************************************/

function salvarVenda() {

  esconderErro();


  const cliente =
    document
      .getElementById(
        'cliente'
      )
      .value
      .trim();


  const descricao =
    document
      .getElementById(
        'descricao'
      )
      .value
      .trim();


  const valorTexto =
    document
      .getElementById(
        'valor'
      )
      .value
      .trim();


  if (!descricao) {

    mostrarErro(
      'Digite ou dite a descrição da venda.'
    );

    return;

  }


  if (!valorTexto) {

    mostrarErro(
      'Informe o valor da venda.'
    );

    return;

  }


  /*
   * Aceita:
   * 30
   * 30,00
   * 30.00
   * 1.250,50
   */

  let valorNormalizado =
    valorTexto
      .replace(
        /R\$/gi,
        ''
      )
      .trim();


  if (
    valorNormalizado.includes(',')
  ) {

    valorNormalizado =
      valorNormalizado
        .replace(
          /\./g,
          ''
        )
        .replace(
          ',',
          '.'
        );

  }


  const valor =
    parseFloat(
      valorNormalizado
    );


  if (
    isNaN(valor) ||
    valor <= 0
  ) {

    mostrarErro(
      'O valor da venda é inválido.'
    );

    return;

  }


  const btn =
    document
      .getElementById(
        'btnSalvar'
      );


  btn.disabled =
    true;


  btn.textContent =
    '⏳ SALVANDO...';


  voiceStatus.textContent =
    '💳 Salvando venda e gerando Pix...';


  api(
    'registrarVenda',
    {

      cliente:
        cliente ||
        'Cliente não informado',

      descricao:
        descricao,

      valor:
        valor.toFixed(2)

    },

    function(resultado) {

      console.log(
        'Salvar:',
        resultado
      );


      btn.disabled =
        false;


      btn.textContent =
        '💳 SALVAR E GERAR PIX';


      if (
        !resultado
      ) {

        mostrarErro(
          'O servidor não retornou resposta.'
        );

        return;

      }


      if (
        resultado.success !==
        true
      ) {

        mostrarErro(
          resultado.erro ||
          'Não foi possível salvar a venda.'
        );

        return;

      }


      document
        .getElementById(
          'idVenda'
        )
        .value =
        resultado.idVenda ||
        '';


      const pix =
        resultado.pixCode ||
        '';


      if (!pix) {

        mostrarErro(
          'Venda salva, mas o Pix não foi retornado.'
        );

        return;

      }


      document
        .getElementById(
          'pixCode'
        )
        .textContent =
        pix;


      /*
       * QR CODE
       */

      const qr =
        document.getElementById(
          'qrCode'
        );


      qr.src =
        'https://api.qrserver.com/v1/create-qr-code/' +
        '?size=300x300&data=' +
        encodeURIComponent(
          pix
        );


      document
        .getElementById(
          'mensagemResultado'
        )
        .textContent =
        'Venda ' +
        resultado.idVenda +
        ' registrada com sucesso. ' +
        'Pix gerado no valor de R$ ' +
        valor
          .toFixed(2)
          .replace(
            '.',
            ','
          ) +
        '.';


      document
        .getElementById(
          'resultado'
        )
        .style
        .display =
        'block';


      // Assim que o QR Code foi gerado, começa a janela de 5 minutos.
      iniciarMonitoramentoPagamento(
        resultado.idVenda,
        resultado.inicioMonitoramento
      );

      mostrarSucesso(
        '✅ Venda salva e Pix gerado!'
      );

      voiceStatus.textContent =
        '⏳ Aguardando confirmação do pagamento...';

    }

  );

}


/*******************************************************
 * MONITORAMENTO DO E-MAIL NUBANK
 *******************************************************/

function iniciarMonitoramentoPagamento(idVenda, inicioMonitoramento) {
  pararMonitoramentoPagamento();

  if (!idVenda) {
    return;
  }

  monitoramentoAtivo = true;
  monitoramentoInicio = Number(inicioMonitoramento) || Date.now();

  atualizarStatusPagamento('AGUARDANDO');
  atualizarCronometro();

  timerCronometro = setInterval(function() {
    atualizarCronometro();
  }, 1000);

  verificarPagamento();

  timerVerificacao = setInterval(function() {
    verificarPagamento();
  }, INTERVALO_MONITORAMENTO_MS);
}

function verificarPagamento() {
  if (!monitoramentoAtivo) {
    return;
  }

  const idVenda = document.getElementById('idVenda').value.trim();
  const agora = Date.now();

  if (!idVenda || agora >= monitoramentoInicio + TEMPO_MONITORAMENTO_MS) {
    atualizarCronometro();
    pararMonitoramentoPagamento();
    return;
  }

  api(
    'verificarPagamento',
    {
      idVenda: idVenda,
      inicioMonitoramento: monitoramentoInicio
    },
    function(resultado) {
      if (!monitoramentoAtivo) {
        return;
      }

      if (resultado && resultado.confirmado === true) {
        atualizarStatusPagamento('CONFIRMADO');
        pararMonitoramentoPagamento();
        return;
      }

      if (resultado && resultado.status === 'TEMPO_ESGOTADO') {
        atualizarCronometro();
        pararMonitoramentoPagamento();
      }
    }
  );
}

function atualizarCronometro() {
  const elemento = document.getElementById('cronometro');
  if (!elemento || !monitoramentoInicio) {
    return;
  }

  const restante = Math.max(
    0,
    monitoramentoInicio + TEMPO_MONITORAMENTO_MS - Date.now()
  );

  const totalSegundos = Math.ceil(restante / 1000);
  const minutos = Math.floor(totalSegundos / 60);
  const segundos = totalSegundos % 60;

  elemento.textContent =
    String(minutos).padStart(2, '0') + ':' +
    String(segundos).padStart(2, '0');

  if (totalSegundos <= 0) {
    elemento.textContent = '00:00';
  }
}

function atualizarStatusPagamento(status) {
  const caixa = document.getElementById('statusPagamento');
  const titulo = document.getElementById('statusTitulo');
  const subtitulo = document.getElementById('statusSubtitulo');

  if (!caixa || !titulo || !subtitulo) {
    return;
  }

  if (status === 'CONFIRMADO') {
    caixa.classList.add('confirmado');
    titulo.textContent = '✅ CONFIRMADO';
    subtitulo.textContent = 'Pagamento confirmado.';
    return;
  }

  caixa.classList.remove('confirmado');
  titulo.textContent = '⏳ AGUARDANDO CONFIRMAÇÃO';
  subtitulo.textContent = 'Aguardando o e-mail do Nubank.';
}

function pararMonitoramentoPagamento() {
  monitoramentoAtivo = false;

  if (timerCronometro) {
    clearInterval(timerCronometro);
    timerCronometro = null;
  }

  if (timerVerificacao) {
    clearInterval(timerVerificacao);
    timerVerificacao = null;
  }
}


/*******************************************************
 * API JSONP
 *******************************************************/

function api(
  action,
  dados,
  callback
) {

  if (
    !API_URL ||
    !API_URL.includes(
      'script.google.com'
    )
  ) {

    mostrarErro(
      'A URL do Apps Script está incorreta.'
    );

    return;

  }


  const callbackName =
    'vendasIA_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  let finalizado =
    false;


  let script =
    null;


  const timeout =
    setTimeout(
      function() {

        if (
          finalizado
        ) {
          return;
        }


        finalizado =
          true;


        delete window[
          callbackName
        ];


        if (
          script &&
          script.parentNode
        ) {

          script
            .parentNode
            .removeChild(
              script
            );

        }


        mostrarErro(
          'Tempo esgotado ao comunicar com o Google Apps Script.'
        );

      },
      30000
    );


  window[callbackName] =
    function(resultado) {

      if (
        finalizado
      ) {
        return;
      }


      finalizado =
        true;


      clearTimeout(
        timeout
      );


      try {

        callback(
          resultado
        );

      } catch (erro) {

        console.error(
          erro
        );

        mostrarErro(
          'Erro ao processar a resposta do servidor.'
        );

      }


      delete window[
        callbackName
      ];


      if (
        script &&
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }

    };


  const params =
    new URLSearchParams();


  params.set(
    'action',
    action
  );


  params.set(
    'callback',
    callbackName
  );


  if (dados) {

    Object.keys(
      dados
    ).forEach(
      function(chave) {

        const valor =
          dados[chave];


        if (
          valor !==
          undefined &&
          valor !==
          null
        ) {

          params.set(
            chave,
            String(valor)
          );

        }

      }
    );

  }


  const url =
    API_URL +
    (
      API_URL.includes('?')
        ? '&'
        : '?'
    ) +
    params.toString();


  console.log(
    'Chamando API:',
    url
  );


  script =
    document.createElement(
      'script'
    );


  script.src =
    url;


  script.async =
    true;


  script.onerror =
    function() {

      if (
        finalizado
      ) {
        return;
      }


      finalizado =
        true;


      clearTimeout(
        timeout
      );


      delete window[
        callbackName
      ];


      if (
        script &&
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }


      mostrarErro(
        'Não consegui conectar ao Google Apps Script. Verifique a implantação do Web App.'
      );

    };


  document
    .head
    .appendChild(
      script
    );

}


/*******************************************************
 * COPIAR PIX
 *******************************************************/

function copiarPix() {

  const pix =
    document
      .getElementById(
        'pixCode'
      )
      .textContent
      .trim();


  if (!pix) {

    mostrarErro(
      'Não existe Pix para copiar.'
    );

    return;

  }


  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard
      .writeText(
        pix
      )
      .then(
        function() {

          mostrarSucesso(
            '📋 Pix copiado!'
          );

        }
      )
      .catch(
        function() {

          copiarPixAntigo(
            pix
          );

        }
      );

    return;

  }


  copiarPixAntigo(
    pix
  );

}


function copiarPixAntigo(
  texto
) {

  const area =
    document.createElement(
      'textarea'
    );


  area.value =
    texto;


  area.style.position =
    'fixed';

  area.style.left =
    '-9999px';


  document
    .body
    .appendChild(
      area
    );


  area.select();


  try {

    document.execCommand(
      'copy'
    );


    mostrarSucesso(
      '📋 Pix copiado!'
    );

  } catch (erro) {

    mostrarErro(
      'Selecione o código Pix manualmente.'
    );

  }


  document
    .body
    .removeChild(
      area
    );
}


/*******************************************************
 * LIMPAR
 *******************************************************/

function limparTela() {

  pararMonitoramentoPagamento();

  pararTimerVoz();
  encerramentoVozSolicitado = true;

  if (reconhecimento) {
    try {
      reconhecimento.stop();
    } catch (erro) {
      console.error(erro);
    }
  }

  finalizarVoz();
  monitoramentoInicio = 0;

  document
    .getElementById(
      'cliente'
    )
    .value =
    '';


  document
    .getElementById(
      'descricao'
    )
    .value =
    '';


  document
    .getElementById(
      'valor'
    )
    .value =
    '';


  document
    .getElementById(
      'idVenda'
    )
    .value =
    '';


  document
    .getElementById(
      'transcript'
    )
    .textContent =

    .getElementById(

    .innerHTML =

}


/*******************************************************
 * MENSAGENS
 *******************************************************/

function mostrarErro(
  mensagem
) {

  const erro =
    document.getElementById(
      'erro'
    );


  erro.textContent =
    '❌ ' + mensagem;


  erro.style.display =
    'block';


  document
    .getElementById(
      'sucesso'
    )
    .style
    .display =
    'none';
}


function esconderErro() {

  document
    .getElementById(
      'erro'
    )
    .style
    .display =
    'none';
}


function mostrarSucesso(
  mensagem
) {

  const sucesso =
    document.getElementById(
      'sucesso'
    );


  sucesso.textContent =
    mensagem;


  sucesso.style.display =
    'block';


  document
    .getElementById(
      'erro'
    )
    .style
    .display =
    'none';
}

    ) {

);
