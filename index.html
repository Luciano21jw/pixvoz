<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"

>

<title>Vendas IA + Pix</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;
  padding: 20px;

  font-family: Arial, Helvetica, sans-serif;

  background: #f4f6f8;

  color: #222;
}

.container {

  width: 100%;
  max-width: 650px;

  margin: auto;
}

.card {

  background: white;

  border-radius: 18px;

  padding: 22px;

  box-shadow:
    0 5px 25px rgba(0,0,0,.08);
}

h1 {

  text-align: center;

  margin-top: 0;

  font-size: 25px;
}

.subtitulo {

  text-align: center;

  color: #666;

  margin-bottom: 25px;
}

label {

  display: block;

  font-weight: bold;

  margin-top: 15px;

  margin-bottom: 6px;
}

input,
textarea {

  width: 100%;

  padding: 13px;

  border: 1px solid #ddd;

  border-radius: 10px;

  font-size: 16px;

  outline: none;
}

textarea {

  min-height: 80px;

  resize: vertical;
}

.linha {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;
}

.voz-area {

  text-align: center;

  padding: 10px 0 20px;
}

#voiceBtn {

  width: 90px;

  height: 90px;

  border-radius: 50%;

  border: none;

  background: #111;

  color: white;

  font-size: 36px;

  cursor: pointer;
}

#voiceBtn.recording {

  background: #d62828;

  animation: pulsar 1.2s infinite;
}

@keyframes pulsar {

  0% {
    box-shadow: 0 0 0 0 rgba(214,40,40,.6);
  }

  70% {
    box-shadow: 0 0 0 22px rgba(214,40,40,0);
  }

  100% {
    box-shadow: 0 0 0 0 rgba(214,40,40,0);
  }
}

#voiceStatus {

  margin-top: 12px;

  font-weight: bold;

  min-height: 24px;
}

.voice-timer {

  margin-top: 8px;

  font-size: 22px;

  font-weight: bold;

  min-height: 28px;

}

.voice-timer.recording {

  color: #d62828;

}

.transcricao {

  background: #f0f2f4;

  border-radius: 12px;

  padding: 14px;

  margin-top: 12px;

  min-height: 50px;

  text-align: left;
}

.ajuda {

  margin-top: 10px;

  font-size: 14px;

  color: #777;

  line-height: 1.5;
}

button {

  border: none;

  border-radius: 10px;

  padding: 14px;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

.btnSalvar {

  width: 100%;

  margin-top: 20px;

  background: #16803c;

  color: white;

  font-size: 18px;
}

.btnSalvar:disabled {

  background: #aaa;

  cursor: not-allowed;
}

.btnLimpar {

  width: 100%;

  margin-top: 10px;

  background: #eee;
}

.resultado {

  display: none;

  margin-top: 22px;

  padding: 18px;

  border-radius: 14px;

  background: #eef8f1;

  border: 1px solid #b7dfc2;
}

.pix {

  background: white;

  border: 1px solid #ddd;

  border-radius: 10px;

  padding: 12px;

  margin-top: 12px;

  word-break: break-all;

  font-size: 13px;
}

.btnCopiar {

  width: 100%;

  margin-top: 10px;

  background: #222;

  color: white;
}

.erro,
.sucesso {

  padding: 14px;

  border-radius: 10px;

  margin-top: 15px;
}

.erro {

  background: #fff0f0;

  border: 1px solid #e5aaaa;

  color: #9d1c1c;

  display: none;
}

.sucesso {

  background: #edf9f0;

  border: 1px solid #b8dfc1;

  color: #16652d;

  display: none;
}

.produto {
  position: relative;
  overflow: hidden;
  background: #f6f6f6;
  padding: 0;
  border-radius: 9px;
  margin-top: 8px;
  min-height: 48px;
  touch-action: pan-y;
  user-select: none;
  transition: transform 0.18s ease;
}

.produto.arrastando {
  transition: none;
}

.produto-conteudo {
  position: relative;
  z-index: 2;
  background: #f6f6f6;
  padding: 12px 52px 12px 10px;
  min-height: 48px;
  display: flex;
  align-items: center;
  box-sizing: border-box;
}

.produto-apagar {
  position: absolute;
  z-index: 1;
  right: 0;
  top: 0;
  width: 52px;
  height: 100%;
  background: #d62828;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  cursor: pointer;
}

.qr {

  text-align: center;

  margin-top: 15px;
}

.qr img {

  width: 220px;

  height: 220px;

  max-width: 100%;
}

/* STATUS DO PAGAMENTO */

.status-pagamento {
  text-align: center;
  margin-top: 18px;
  padding: 16px 14px;
  border-radius: 14px;
  background: #fff8e6;
  border: 1px solid #f0d98a;
}

.status-pagamento.confirmado {
  background: #edf9f0;
  border-color: #b8dfc1;
}

.status-titulo {
  font-size: 20px;
  font-weight: bold;
  margin-bottom: 6px;
}

.status-subtitulo {
  color: #666;
  font-size: 14px;
}

.cronometro {
  margin-top: 10px;
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 1px;
}

.qr {
  text-align: center;
  margin-top: 15px;
}

.qr img {
  display: block;
  width: 220px;
  height: 220px;
  max-width: 100%;
  margin: 0 auto;
}

@media(max-width:550px) {

  body {
    padding: 10px;
  }

  .card {
    padding: 16px;
  }

  .linha {
    grid-template-columns: 1fr;
  }
}

</style>

</head>

<script>

/*******************************************************
 * URL DO SEU WEB APP
 *******************************************************/

const API_URL =
  'https://script.google.com/macros/s/AKfycbyNau5Yc32N9HtYzjWNZGSiCwYz8Ila3L19YtEo_ax4oohzgtAXzWX5cSTbMvoj7G5POw/exec';

const TEMPO_MONITORAMENTO_MS = 5 * 60 * 1000;
const INTERVALO_MONITORAMENTO_MS = 10 * 1000;
let monitoramentoAtivo = false;
let monitoramentoInicio = 0;
let timerCronometro = null;
let timerVerificacao = null;


/*******************************************************
 * VOZ
 *
 * UMA FALA POR CLIQUE.
 *
 * O navegador não fica reiniciando a sessão de voz.
 * Isso evita a duplicação que fazia "feijão" aparecer
 * várias vezes quando o usuário falava apenas uma vez.
 *
 * Para adicionar outro produto:
 * 1. clique no microfone;
 * 2. fale o produto e o valor;
 * 3. aguarde o reconhecimento;
 * 4. clique novamente para o próximo produto.
 *******************************************************/

const TEMPO_MAXIMO_VOZ_MS = 60 * 1000;

let reconhecimento = null;
let gravando = false;
let textoFinalVoz = '';
let inicioVoz = 0;
let timerVoz = null;
let encerramentoVozSolicitado = false;
let processandoFala = false;


const voiceBtn =
  document.getElementById('voiceBtn');

const voiceStatus =
  document.getElementById('voiceStatus');

const voiceTimer =
  document.getElementById('voiceTimer');

const transcript =
  document.getElementById('transcript');


function iniciarVoz() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    mostrarErro(
      'Seu navegador não suporta reconhecimento de voz. Use o Google Chrome.'
    );
    return;
  }

  if (gravando) {
    encerramentoVozSolicitado = true;

    if (reconhecimento) {
      try {
        reconhecimento.stop();
      } catch (erro) {
        console.error(erro);
      }
    }

    return;
  }

  pararTimerVoz();

  textoFinalVoz = '';
  inicioVoz = Date.now();
  encerramentoVozSolicitado = false;
  processandoFala = false;

  transcript.textContent =
    '🎤 Estou ouvindo...';

  atualizarTimerVoz();

  iniciarSessaoVoz(SpeechRecognition);

  timerVoz = setInterval(function() {

    atualizarTimerVoz();

    if (
      Date.now() - inicioVoz >=
      TEMPO_MAXIMO_VOZ_MS
    ) {
      encerrarVozPorTempo();
    }

  }, 250);
}


function iniciarSessaoVoz(SpeechRecognition) {

  reconhecimento =
    new SpeechRecognition();

  reconhecimento.lang =
    'pt-BR';

  /*
   * IMPORTANTE:
   * false = uma fala por clique.
   * Não reiniciamos a sessão automaticamente.
   */
  reconhecimento.continuous =
    false;

  /*
   * Só usamos resultado final.
   * Isso evita que o texto provisório seja
   * acumulado várias vezes.
   */
  reconhecimento.interimResults =
    false;

  reconhecimento.maxAlternatives =
    1;


  reconhecimento.onstart =
    function() {

      gravando = true;

      voiceBtn.classList.add(
        'recording'
      );

      voiceBtn.textContent =
        '⏹️';

      voiceStatus.textContent =
        '🔴 Ouvindo... fale o produto e o valor';

      voiceTimer.classList.add(
        'recording'
      );

      esconderErro();
    };


  reconhecimento.onresult =
    function(event) {

      if (processandoFala) {
        return;
      }

      let texto =
        '';

      /*
       * Como continuous=false, pegamos somente
       * o resultado final desta fala.
       */
      for (
        let i = 0;
        i < event.results.length;
        i++
      ) {

        if (
          event.results[i].isFinal
        ) {

          const parte =
            event.results[i][0]
              .transcript
              .trim();

          if (parte) {
            texto +=
              (texto ? ' ' : '') +
              parte;
          }
        }
      }

      texto =
        texto.trim();

      if (!texto) {
        return;
      }

      textoFinalVoz =
        texto;

      transcript.textContent =
        textoFinalVoz;

    };


  reconhecimento.onerror =
    function(event) {

      console.error(
        'Erro de voz:',
        event.error
      );

      if (
        event.error ===
        'not-allowed'
      ) {

        encerramentoVozSolicitado = true;

        mostrarErro(
          '🚫 Permita o acesso ao microfone no navegador.'
        );

        finalizarVoz();

        return;
      }

      if (
        event.error ===
        'audio-capture'
      ) {

        encerramentoVozSolicitado = true;

        mostrarErro(
          '🎤 Não consegui acessar o microfone.'
        );

        finalizarVoz();

        return;
      }

      /*
       * "no-speech" é tratado como uma fala vazia.
       * Não reiniciamos a sessão.
       */
      if (
        event.error ===
        'no-speech'
      ) {
        return;
      }

      if (
        event.error ===
        'aborted'
      ) {
        return;
      }

      mostrarErro(
        'Erro no reconhecimento de voz: ' +
        event.error
      );

    };


  reconhecimento.onend =
    function() {

      if (processandoFala) {
        finalizarVoz();
        return;
      }

      const texto =
        textoFinalVoz.trim();

      finalizarVoz();

      if (
        texto
      ) {

        processandoFala =
          true;

        interpretarIA(texto);

      } else if (
        !encerramentoVozSolicitado
      ) {

        mostrarErro(
          '🎤 Não detectei sua fala. Clique novamente e fale o produto e o valor.'
        );

      }

    };


  try {

    reconhecimento.start();

  } catch (erro) {

    console.error(
      erro
    );

    mostrarErro(
      'Não foi possível iniciar o microfone. Tente novamente.'
    );

    finalizarVoz();

  }

}


function encerrarVozPorTempo() {

  if (!inicioVoz) {
    return;
  }

  encerramentoVozSolicitado =
    true;

  atualizarTimerVoz();
  pararTimerVoz();

  voiceStatus.textContent =
    '⏱️ Tempo máximo atingido. Finalizando...';

  if (reconhecimento) {

    try {
      reconhecimento.stop();
    } catch (erro) {
      console.error(erro);
      finalizarVoz();

      if (
        textoFinalVoz.trim()
      ) {
        processandoFala = true;
        interpretarIA(
          textoFinalVoz.trim()
        );
      }
    }

  } else {

    finalizarVoz();

    if (
      textoFinalVoz.trim()
    ) {
      processandoFala = true;
      interpretarIA(
        textoFinalVoz.trim()
      );
    }

  }

}


function atualizarTimerVoz() {

  if (
    !voiceTimer ||
    !inicioVoz
  ) {
    return;
  }

  const restante =
    Math.max(
      0,
      TEMPO_MAXIMO_VOZ_MS -
      (Date.now() - inicioVoz)
    );

  const totalSegundos =
    Math.ceil(
      restante / 1000
    );

  const minutos =
    Math.floor(
      totalSegundos / 60
    );

  const segundos =
    totalSegundos % 60;

  voiceTimer.textContent =
    String(minutos).padStart(2, '0') +
    ':' +
    String(segundos).padStart(2, '0');

  if (
    totalSegundos <= 0
  ) {
    voiceTimer.textContent =
      '00:00';
  }

}


function pararTimerVoz() {

  if (timerVoz) {

    clearInterval(
      timerVoz
    );

    timerVoz = null;

  }

}


function finalizarVoz() {

  pararTimerVoz();

  gravando =
    false;

  inicioVoz =
    0;

  encerramentoVozSolicitado =
    false;

  if (voiceBtn) {

    voiceBtn.classList.remove(
      'recording'
    );

    voiceBtn.textContent =
      '🎤';

  }

  if (voiceTimer) {

    voiceTimer.classList.remove(
      'recording'
    );

    voiceTimer.textContent =
      '01:00';

  }

}

/*******************************************************
 * PRODUTOS ACUMULADOS
 *******************************************************/

let produtosAcumulados = [];
let valorTotalAcumulado = 0;


/*******************************************************
 * INTERPRETAR IA
 *
 * Cada fala adiciona produtos à lista existente.
 *******************************************************/

function interpretarIA(texto) {

  if (!texto) {

    processandoFala =
      false;

    mostrarErro(
      'Não recebi o texto da sua fala.'
    );

    return;

  }

  voiceStatus.textContent =
    '🤖 Identificando produto e valor...';


  api(
    'interpretarVenda',
    {
      texto: texto
    },

    function(resultado) {

      processandoFala =
        false;

      console.log(
        'IA:',
        resultado
      );


      if (!resultado) {

        mostrarErro(
          'O servidor não retornou resposta.'
        );

        return;

      }


      if (
        resultado.success === false &&
        resultado.erro
      ) {

        mostrarErro(
          resultado.erro
        );

        return;

      }


      if (
        resultado.erro
      ) {

        if (
          resultado.erro ===
          'valor_ausente'
        ) {

          mostrarErro(
            'Não encontrei o valor. Fale o produto e o valor.'
          );

        } else {

          mostrarErro(
            'Não consegui identificar o produto.'
          );

        }

        return;

      }


      const novosProdutos =
        Array.isArray(
          resultado.produtos
        )
          ? resultado.produtos
          : [];


      if (
        novosProdutos.length === 0
      ) {

        mostrarErro(
          'Nenhum produto foi identificado.'
        );

        return;

      }


      /*
       * ADICIONA os produtos novos.
       * Não substitui os anteriores.
       */
      novosProdutos.forEach(
        function(produto) {

          produtosAcumulados.push({

            nome:
              produto.nome ||
              'Produto',

            quantidade:
              Number(
                produto.quantidade
              ) || 1,

            valorTotal:
              Number(
                produto.valorTotal
              ) || 0

          });

        }
      );


      const novoValor =
        Number(
          resultado.valor
        );


      if (
        !isNaN(novoValor) &&
        novoValor > 0
      ) {

        valorTotalAcumulado +=
          novoValor;

      }


      atualizarValorTotal();

      mostrarProdutos(
        produtosAcumulados
      );


      voiceStatus.textContent =
        '✅ Produto adicionado! Pode falar o próximo.';


      mostrarSucesso(
        'Produto adicionado. Clique novamente no microfone para adicionar outro.'
      );

    }

  );

}


/*******************************************************
 * ATUALIZAR TOTAL
 *******************************************************/

function atualizarValorTotal() {

  const campo =
    document.getElementById(
      'valor'
    );

  if (!campo) {
    return;
  }

  campo.value =
    valorTotalAcumulado
      .toFixed(2)
      .replace(
        '.',
        ','
      );

}


/*******************************************************
 * PRODUTOS
 *
 * Cada produto pode ser arrastado para a esquerda
 * para ser removido.
 *******************************************************/

function mostrarProdutos(
  produtos
) {

  const div =
    document.getElementById(
      'produtos'
    );

  div.innerHTML =
    '';


  if (
    !Array.isArray(produtos) ||
    produtos.length === 0
  ) {

    return;

  }


  const titulo =
    document.createElement(
      'div'
    );

  titulo.className =
    'produtos-titulo';

  titulo.innerHTML =
    '<b>🛒 Produtos identificados:</b>';

  div.appendChild(
    titulo
  );


  produtos.forEach(
    function(produto, indice) {

      const item =
        document.createElement(
          'div'
        );

      item.className =
        'produto';

      item.dataset.index =
        String(indice);


      const conteudo =
        document.createElement(
          'div'
        );

      conteudo.className =
        'produto-conteudo';


      const nome =
        produto.nome ||
        'Produto';

      const quantidade =
        Number(
          produto.quantidade
        ) || 1;

      const valor =
        Number(
          produto.valorTotal
        ) || 0;


      let texto =
        '🛒 ' +
        quantidade +
        'x ' +
        nome;


      if (
        valor > 0
      ) {

        texto +=
          ' — R$ ' +
          valor
            .toFixed(2)
            .replace(
              '.',
              ','
            );

      }


      conteudo.textContent =
        texto;


      const apagar =
        document.createElement(
          'div'
        );

      apagar.className =
        'produto-apagar';

      apagar.textContent =
        '🗑️';

      apagar.title =
        'Excluir produto';


      apagar.onclick =
        function(event) {

          event.stopPropagation();

          removerProduto(
            indice
          );

        };


      item.appendChild(
        conteudo
      );

      item.appendChild(
        apagar
      );


      configurarArrastarProduto(
        item,
        indice
      );


      div.appendChild(
        item
      );

    }
  );

}


/*******************************************************
 * REMOVER PRODUTO
 *******************************************************/

function removerProduto(
  indice
) {

  if (
    indice < 0 ||
    indice >=
      produtosAcumulados.length
  ) {
    return;
  }


  const produto =
    produtosAcumulados[
      indice
    ];


  const valorRemovido =
    Number(
      produto.valorTotal
    ) || 0;


  produtosAcumulados.splice(
    indice,
    1
  );


  /*
   * Se o produto possui valor próprio,
   * retiramos esse valor do total.
   */
  if (
    valorRemovido > 0
  ) {

    valorTotalAcumulado =
      Math.max(
        0,
        valorTotalAcumulado -
        valorRemovido
      );

  }


  atualizarValorTotal();

  mostrarProdutos(
    produtosAcumulados
  );


  mostrarSucesso(
    '🗑️ Produto removido.'
  );

}


/*******************************************************
 * ARRASTAR PARA A ESQUERDA
 *******************************************************/

function configurarArrastarProduto(
  item,
  indice
) {

  const conteudo =
    item.querySelector(
      '.produto-conteudo'
    );

  if (!conteudo) {
    return;
  }

  let inicioX =
    0;

  let atualX =
    0;

  let arrastando =
    false;


  item.addEventListener(
    'touchstart',
    function(event) {

      if (
        event.touches.length !== 1
      ) {
        return;
      }

      inicioX =
        event.touches[0].clientX;

      atualX =
        inicioX;

      arrastando =
        true;

      item.classList.add(
        'arrastando'
      );

    },
    {
      passive: true
    }
  );


  item.addEventListener(
    'touchmove',
    function(event) {

      if (!arrastando) {
        return;
      }

      atualX =
        event.touches[0].clientX;

      const deslocamento =
        atualX - inicioX;


      /*
       * Só permite arrastar para a esquerda.
       */
      if (
        deslocamento < 0
      ) {

        conteudo.style.transform =
          'translateX(' +
          Math.max(
            -130,
            deslocamento
          ) +
          'px)';

      }

    },
    {
      passive: true
    }
  );


  item.addEventListener(
    'touchend',
    function() {

      if (!arrastando) {
        return;
      }

      arrastando =
        false;

      item.classList.remove(
        'arrastando'
      );


      const deslocamento =
        atualX - inicioX;


      /*
       * Arrastou pelo menos 70px para a esquerda:
       * exclui o produto.
       */
      if (
        deslocamento <= -70
      ) {

        removerProduto(
          indice
        );

      } else {

        conteudo.style.transform =
          '';

      }

    }
  );


  /*
   * Também funciona com mouse em computador.
   */

  item.addEventListener(
    'mousedown',
    function(event) {

      inicioX =
        event.clientX;

      atualX =
        inicioX;

      arrastando =
        true;

      item.classList.add(
        'arrastando'
      );

    }
  );


  item.addEventListener(
    'mousemove',
    function(event) {

      if (!arrastando) {
        return;
      }

      atualX =
        event.clientX;

      const deslocamento =
        atualX - inicioX;

      if (
        deslocamento < 0
      ) {

        conteudo.style.transform =
          'translateX(' +
          Math.max(
            -130,
            deslocamento
          ) +
          'px)';

      }

    }
  );


  item.addEventListener(
    'mouseup',
    function() {

      if (!arrastando) {
        return;
      }

      arrastando =
        false;

      item.classList.remove(
        'arrastando'
      );


      const deslocamento =
        atualX - inicioX;


      if (
        deslocamento <= -70
      ) {

        removerProduto(
          indice
        );

      } else {

        conteudo.style.transform =
          '';

      }

    }
  );


  item.addEventListener(
    'mouseleave',
    function() {

      if (!arrastando) {
        return;
      }

      arrastando =
        false;

      item.classList.remove(
        'arrastando'
      );

      conteudo.style.transform =
        '';

    }
  );

}

/*******************************************************
 * SALVAR
 *******************************************************/

function salvarVenda() {

  esconderErro();


  if (
    produtosAcumulados.length === 0
  ) {

    mostrarErro(
      'Nenhum produto foi identificado.'
    );

    return;

  }


  const valor =
    Number(
      valorTotalAcumulado
    );


  if (
    isNaN(valor) ||
    valor <= 0
  ) {

    mostrarErro(
      'O valor total da venda é inválido.'
    );

    return;

  }


  /*
   * Monta automaticamente a descrição
   * somente a partir dos produtos.
   */
  const descricao =
    produtosAcumulados
      .map(
        function(produto) {

          return (
            produto.quantidade +
            'x ' +
            produto.nome
          );

        }
      )
      .join(
        ', '
      );


  const btn =
    document.getElementById(
      'btnSalvar'
    );


  btn.disabled =
    true;

  btn.textContent =
    '⏳ SALVANDO...';

  voiceStatus.textContent =
    '💳 Salvando venda e gerando Pix...';


  api(
    'registrarVenda',
    {

      /*
       * Não existe cliente na tela.
       */
      cliente:
        'Cliente não informado',

      descricao:
        descricao,

      valor:
        valor.toFixed(2)

    },

    function(resultado) {

      console.log(
        'Salvar:',
        resultado
      );


      btn.disabled =
        false;

      btn.textContent =
        '💳 SALVAR E GERAR PIX';


      if (!resultado) {

        mostrarErro(
          'O servidor não retornou resposta.'
        );

        return;

      }


      if (
        resultado.success !== true
      ) {

        mostrarErro(
          resultado.erro ||
          'Não foi possível salvar a venda.'
        );

        return;

      }


      document
        .getElementById(
          'idVenda'
        )
        .value =
        resultado.idVenda ||
        '';


      const pix =
        resultado.pixCode ||
        '';


      if (!pix) {

        mostrarErro(
          'Venda salva, mas o Pix não foi retornado.'
        );

        return;

      }


      document
        .getElementById(
          'pixCode'
        )
        .textContent =
        pix;


      const qr =
        document.getElementById(
          'qrCode'
        );


      qr.src =
        'https://api.qrserver.com/v1/create-qr-code/' +
        '?size=300x300&data=' +
        encodeURIComponent(
          pix
        );


      document
        .getElementById(
          'mensagemResultado'
        )
        .textContent =
        'Venda ' +
        resultado.idVenda +
        ' registrada com sucesso. ' +
        'Pix gerado no valor de R$ ' +
        valor
          .toFixed(2)
          .replace(
            '.',
            ','
          ) +
        '.';


      document
        .getElementById(
          'resultado'
        )
        .style
        .display =
        'block';


      iniciarMonitoramentoPagamento(
        resultado.idVenda,
        resultado.inicioMonitoramento
      );


      mostrarSucesso(
        '✅ Venda salva e Pix gerado!'
      );


      voiceStatus.textContent =
        '⏳ Aguardando confirmação do pagamento...';

    }

  );

}

/*******************************************************
 * MONITORAMENTO DO E-MAIL NUBANK
 *******************************************************/

function iniciarMonitoramentoPagamento(idVenda, inicioMonitoramento) {
  pararMonitoramentoPagamento();

  if (!idVenda) {
    return;
  }

  monitoramentoAtivo = true;
  monitoramentoInicio = Number(inicioMonitoramento) || Date.now();

  atualizarStatusPagamento('AGUARDANDO');
  atualizarCronometro();

  timerCronometro = setInterval(function() {
    atualizarCronometro();
  }, 1000);

  verificarPagamento();

  timerVerificacao = setInterval(function() {
    verificarPagamento();
  }, INTERVALO_MONITORAMENTO_MS);
}

function verificarPagamento() {
  if (!monitoramentoAtivo) {
    return;
  }

  const idVenda = document.getElementById('idVenda').value.trim();
  const agora = Date.now();

  if (!idVenda || agora >= monitoramentoInicio + TEMPO_MONITORAMENTO_MS) {
    atualizarCronometro();
    pararMonitoramentoPagamento();
    return;
  }

  api(
    'verificarPagamento',
    {
      idVenda: idVenda,
      inicioMonitoramento: monitoramentoInicio
    },
    function(resultado) {
      if (!monitoramentoAtivo) {
        return;
      }

      if (resultado && resultado.confirmado === true) {
        atualizarStatusPagamento('CONFIRMADO');
        pararMonitoramentoPagamento();
        return;
      }

      if (resultado && resultado.status === 'TEMPO_ESGOTADO') {
        atualizarCronometro();
        pararMonitoramentoPagamento();
      }
    }
  );
}

function atualizarCronometro() {
  const elemento = document.getElementById('cronometro');
  if (!elemento || !monitoramentoInicio) {
    return;
  }

  const restante = Math.max(
    0,
    monitoramentoInicio + TEMPO_MONITORAMENTO_MS - Date.now()
  );

  const totalSegundos = Math.ceil(restante / 1000);
  const minutos = Math.floor(totalSegundos / 60);
  const segundos = totalSegundos % 60;

  elemento.textContent =
    String(minutos).padStart(2, '0') + ':' +
    String(segundos).padStart(2, '0');

  if (totalSegundos <= 0) {
    elemento.textContent = '00:00';
  }
}

function atualizarStatusPagamento(status) {
  const caixa = document.getElementById('statusPagamento');
  const titulo = document.getElementById('statusTitulo');
  const subtitulo = document.getElementById('statusSubtitulo');

  if (!caixa || !titulo || !subtitulo) {
    return;
  }

  if (status === 'CONFIRMADO') {
    caixa.classList.add('confirmado');
    titulo.textContent = '✅ CONFIRMADO';
    subtitulo.textContent = 'Pagamento confirmado.';
    return;
  }

  caixa.classList.remove('confirmado');
  titulo.textContent = '⏳ AGUARDANDO CONFIRMAÇÃO';
  subtitulo.textContent = 'Aguardando o e-mail do Nubank.';
}

function pararMonitoramentoPagamento() {
  monitoramentoAtivo = false;

  if (timerCronometro) {
    clearInterval(timerCronometro);
    timerCronometro = null;
  }

  if (timerVerificacao) {
    clearInterval(timerVerificacao);
    timerVerificacao = null;
  }
}


/*******************************************************
 * API JSONP
 *******************************************************/

function api(
  action,
  dados,
  callback
) {

  if (
    !API_URL ||
    !API_URL.includes(
      'script.google.com'
    )
  ) {

    mostrarErro(
      'A URL do Apps Script está incorreta.'
    );

    return;

  }


  const callbackName =
    'vendasIA_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random() * 100000
    );


  let finalizado =
    false;


  let script =
    null;


  const timeout =
    setTimeout(
      function() {

        if (
          finalizado
        ) {
          return;
        }


        finalizado =
          true;


        delete window[
          callbackName
        ];


        if (
          script &&
          script.parentNode
        ) {

          script
            .parentNode
            .removeChild(
              script
            );

        }


        mostrarErro(
          'Tempo esgotado ao comunicar com o Google Apps Script.'
        );

      },
      30000
    );


  window[callbackName] =
    function(resultado) {

      if (
        finalizado
      ) {
        return;
      }


      finalizado =
        true;


      clearTimeout(
        timeout
      );


      try {

        callback(
          resultado
        );

      } catch (erro) {

        console.error(
          erro
        );

        mostrarErro(
          'Erro ao processar a resposta do servidor.'
        );

      }


      delete window[
        callbackName
      ];


      if (
        script &&
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }

    };


  const params =
    new URLSearchParams();


  params.set(
    'action',
    action
  );


  params.set(
    'callback',
    callbackName
  );


  if (dados) {

    Object.keys(
      dados
    ).forEach(
      function(chave) {

        const valor =
          dados[chave];


        if (
          valor !==
          undefined &&
          valor !==
          null
        ) {

          params.set(
            chave,
            String(valor)
          );

        }

      }
    );

  }


  const url =
    API_URL +
    (
      API_URL.includes('?')
        ? '&'
        : '?'
    ) +
    params.toString();


  console.log(
    'Chamando API:',
    url
  );


  script =
    document.createElement(
      'script'
    );


  script.src =
    url;


  script.async =
    true;


  script.onerror =
    function() {

      if (
        finalizado
      ) {
        return;
      }


      finalizado =
        true;


      clearTimeout(
        timeout
      );


      delete window[
        callbackName
      ];


      if (
        script &&
        script.parentNode
      ) {

        script
          .parentNode
          .removeChild(
            script
          );

      }


      mostrarErro(
        'Não consegui conectar ao Google Apps Script. Verifique a implantação do Web App.'
      );

    };


  document
    .head
    .appendChild(
      script
    );

}


/*******************************************************
 * COPIAR PIX
 *******************************************************/

function copiarPix() {

  const pix =
    document
      .getElementById(
        'pixCode'
      )
      .textContent
      .trim();


  if (!pix) {

    mostrarErro(
      'Não existe Pix para copiar.'
    );

    return;

  }


  if (
    navigator.clipboard &&
    navigator.clipboard.writeText
  ) {

    navigator.clipboard
      .writeText(
        pix
      )
      .then(
        function() {

          mostrarSucesso(
            '📋 Pix copiado!'
          );

        }
      )
      .catch(
        function() {

          copiarPixAntigo(
            pix
          );

        }
      );

    return;

  }


  copiarPixAntigo(
    pix
  );

}


function copiarPixAntigo(
  texto
) {

  const area =
    document.createElement(
      'textarea'
    );


  area.value =
    texto;


  area.style.position =
    'fixed';

  area.style.left =
    '-9999px';


  document
    .body
    .appendChild(
      area
    );


  area.select();


  try {

    document.execCommand(
      'copy'
    );


    mostrarSucesso(
      '📋 Pix copiado!'
    );

  } catch (erro) {

    mostrarErro(
      'Selecione o código Pix manualmente.'
    );

  }


  document
    .body
    .removeChild(
      area
    );
}


/*******************************************************

function limparTela() {

  pararMonitoramentoPagamento();

  pararTimerVoz();

  encerramentoVozSolicitado =
    true;

  if (reconhecimento) {

    try {
      reconhecimento.stop();
    } catch (erro) {
      console.error(erro);
    }

  }


  finalizarVoz();

  monitoramentoInicio =
    0;


  produtosAcumulados =
    [];


  valorTotalAcumulado =
    0;


  document
    .getElementById(
      'valor'
    )
    .value =

  document
    .getElementById(
      'idVenda'
    )
    .value =
    '';


  document
    .getElementById(
      'transcript'
    )
    .textContent =
    'A fala reconhecida aparecerá aqui.';


  document
    .getElementById(
      'produtos'
    )
    .innerHTML =

    .getElementById(

}

/*******************************************************
 * MENSAGENS
 *******************************************************/

function mostrarErro(
  mensagem
) {

  const erro =
    document.getElementById(
      'erro'
    );


  erro.textContent =
    '❌ ' + mensagem;


  erro.style.display =
    'block';


  document
    .getElementById(
      'sucesso'
    )
    .style
    .display =
    'none';
}


function esconderErro() {

  document
    .getElementById(
      'erro'
    )
    .style
    .display =
    'none';
}


function mostrarSucesso(
  mensagem
) {

  const sucesso =
    document.getElementById(
      'sucesso'
    );


  sucesso.textContent =
    mensagem;


  sucesso.style.display =
    'block';


  document
    .getElementById(
      'erro'
    )
    .style
    .display =
    'none';
}
